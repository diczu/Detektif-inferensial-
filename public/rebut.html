<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tombol Rebutan — Detektif Inferensial Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gelap: #077482;
      --krem: #F7FBFC;
      --mustard: #FA9E2D;
      --abu: #64748B;
      --abu-gelap: #1E242B;
      --font-utama: 'Poppins', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      font-family: var(--font-utama);
      background-color: var(--bg-gelap);
      color: #FFFFFF;
    }

    .wadah-hp {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      transition: background-color 180ms ease;
    }

    .judul-layar {
      text-align: center;
      padding-top: 6px;
    }

    .judul-layar h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--mustard);
    }

    .judul-layar p {
      margin: 0;
      font-size: 0.94rem;
      color: #EAF7F9;
    }

    .kotak-kode {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
    }

    .input-kode-ruang {
      width: 100%;
      padding: 18px 16px;
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      background-color: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      font-size: 2.3rem;
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.3em;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-kode-ruang:focus {
      border-color: var(--mustard);
      background-color: rgba(255, 255, 255, 0.16);
    }

    .tombol-gabung {
      padding: 18px 20px;
      border-radius: 18px;
      border: none;
      background-color: var(--mustard);
      color: #1E242B;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tombol-gabung:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .pesan-error {
      background-color: rgba(220, 38, 38, 0.24);
      border: 1.5px solid #F87171;
      color: #FECACA;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .daftar-pilih-tim {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 11px;
      padding-bottom: 6px;
    }

    .tombol-pilih-tim {
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      color: #FFFFFF;
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      touch-action: manipulation;
    }

    .tombol-pilih-tim:active {
      transform: scale(0.97);
    }

    .header-hp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background-color: rgba(0, 53, 59, 0.72);
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .info-tim-hp {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nama-tim-hp {
      font-size: 1.15rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-kode-hp {
      font-size: 0.78rem;
      color: #CBD5E1;
      font-weight: 700;
    }

    .kanan-header-hp {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-koneksi {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 999px;
      background-color: rgba(0, 0, 0, 0.35);
    }

    .titik {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #EF4444;
    }

    .titik.nyala {
      background-color: #22C55E;
    }

    .tombol-kecil-hp {
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .area-tombol-raksasa {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 120px;
    }

    .tombol-rebut {
      width: 100%;
      height: 100%;
      min-height: 120px;
      border-radius: 28px;
      border: 5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px;
      text-align: center;
      color: #FFFFFF;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
      transition: transform 80ms ease, background-color 140ms ease;
    }

    .tombol-rebut.tutup {
      background-color: var(--abu);
      border-color: rgba(255, 255, 255, 0.2);
      color: #E2E8F0;
      cursor: default;
      box-shadow: none;
    }

    .tombol-rebut.buka {
      animation: denyutRebut 1s ease-in-out infinite;
    }

    .tombol-rebut.buka:active {
      transform: scale(0.95);
    }

    @keyframes denyutRebut {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.55); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
    }

    .tombol-rebut.menang {
      border-color: #FDE047;
      box-shadow: 0 0 0 6px rgba(253, 224, 71, 0.45);
    }

    .tombol-rebut.kalah {
      background-color: var(--abu-gelap);
      border-color: rgba(255, 255, 255, 0.16);
      color: #E2E8F0;
      cursor: default;
    }

    .teks-utama-tombol {
      font-size: clamp(2.1rem, 9.5vw, 3.4rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.08;
    }

    .teks-sub-tombol {
      font-size: clamp(1rem, 4.2vw, 1.35rem);
      font-weight: 700;
      opacity: 0.94;
      max-width: 24ch;
    }

    .bar-bantuan-bawah {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.86);
      flex-shrink: 0;
    }

    .panel-opsi-hp {
      flex-shrink: 0;
      background-color: rgba(0, 53, 59, 0.84);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 44vh;
      max-height: 44dvh;
      overflow-y: auto;
    }

    .judul-panel-opsi-hp {
      font-size: 0.78rem;
      font-weight: 800;
      color: #FDE68A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .daftar-opsi-hp {
      display: grid;
      gap: 6px;
    }

    .opsi-hp-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.26);
      background-color: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }

    .opsi-hp-item:disabled {
      cursor: default;
    }

    .opsi-hp-item.salah {
      background-color: rgba(185, 28, 28, 0.36);
      border-color: rgba(248, 113, 113, 0.5);
      color: rgba(255, 255, 255, 0.56);
      opacity: 0.7;
      cursor: not-allowed;
    }

    .opsi-hp-item.dipilih {
      background-color: rgba(250, 158, 45, 0.28);
      border-color: #FA9E2D;
      box-shadow: 0 0 0 2px rgba(250, 158, 45, 0.45);
    }

    .opsi-hp-huruf {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background-color: var(--mustard);
      color: #1E242B;
      font-weight: 800;
      font-size: 0.78rem;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .opsi-hp-item.salah .opsi-hp-huruf {
      background-color: #DC2626;
      color: #FFFFFF;
    }

    .opsi-hp-item.dipilih .opsi-hp-huruf {
      background-color: #22C55E;
      color: #FFFFFF;
    }

    .opsi-hp-teks {
      flex: 1;
      min-width: 0;
    }

    .opsi-hp-item.salah .opsi-hp-teks {
      text-decoration: line-through;
    }

    .opsi-hp-tag {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
      background-color: rgba(0, 0, 0, 0.28);
    }
  </style>
</head>
<body>
  <div id="app-hp" class="wadah-hp"></div>

  <script type="module">
    /* =========================================================================
       0. KONFIGURASI FIREBASE CLOUD FIRESTORE (SUDAH DISIAPKAN)
       ========================================================================= */
    const firebaseConfig = {
      projectId: 'company-alliance-5w1rw',
      appId: '1:317829518305:web:5ba6c9e9b53f763715b8a0',
      apiKey: 'AIzaSyDswubCyUTst_Ttu7Z3taEGl68i9YDWusY',
      authDomain: 'company-alliance-5w1rw.firebaseapp.com',
      firestoreDatabaseId: 'ai-studio-detektifinferens-a111e239-e716-4be9-97e9-778060e1e369',
      storageBucket: 'company-alliance-5w1rw.firebasestorage.app',
      messagingSenderId: '317829518305'
    };

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      initializeFirestore,
      getFirestore,
      doc,
      getDoc,
      getDocFromServer,
      onSnapshot,
      updateDoc,
      runTransaction,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const OperationType = {
      CREATE: 'create',
      UPDATE: 'update',
      DELETE: 'delete',
      LIST: 'list',
      GET: 'get',
      WRITE: 'write'
    };

    function handleFirestoreError(error, operationType, path) {
      const errInfo = {
        error: error instanceof Error ? error.message : String(error),
        authInfo: {
          userId: null,
          email: null,
          emailVerified: null,
          isAnonymous: null,
          tenantId: null,
          providerInfo: []
        },
        operationType: operationType,
        path: path
      };
      console.error('Firestore Error: ', JSON.stringify(errInfo));
      throw new Error(JSON.stringify(errInfo));
    }

    const TIM_DEFAULT = [
      { id: 1, nama: 'Kelompok A', warna: '#D93829', bentuk: 'lingkaran' },
      { id: 2, nama: 'Kelompok B', warna: '#1D5FD6', bentuk: 'berlian' },
      { id: 3, nama: 'Kelompok C', warna: '#15803D', bentuk: 'segitiga' },
      { id: 4, nama: 'Kelompok D', warna: '#EAB308', bentuk: 'kotak' }
    ];

    const HP_STATE = {
      configValid: false,
      onlineFirebase: true,
      sudahTerimaSnapshot: false,
      kodeRuang: '',
      timId: null,
      sedangGabung: false,
      ruangTidakAda: false,
      pesanError: '',
      statusServer: 'tutup',
      rondeSoal: 0,
      pemenang: null,
      terkunciTim: { 1: false, 2: false, 3: false, 4: false },
      opsiSalah: { 0: false, 1: false, 2: false, 3: false },
      opsiTeks: { 0: '', 1: '', 2: '', 3: '' },
      pilihanHp: null,
      ujiCoba: { aktif: false, hasil: { 1: false, 2: false, 3: false, 4: false } },
      ujiCobaSebelumAktif: false,
      ujiCobaHasilSebelum: false,
      modeTes: false,
      namaTim: { 1: 'Kelompok A', 2: 'Kelompok B', 3: 'Kelompok C', 4: 'Kelompok D' },
      warnaTim: { 1: '#D93829', 2: '#1D5FD6', 3: '#15803D', 4: '#EAB308' },
      statusSebelum: 'tutup',
      waktuTekanTerakhir: 0,
      sedangTransaksi: false
    };

    let db = null;
    let lepasListenerRuang = null;
    let timerHeartbeat = null;
    let timerTransaksiAman = null;
    let timTerdaftarId = null;
    let wakeLockSentinel = null;

    function apakahConfigTerisi(cfg) {
      return Boolean(
        cfg
        && cfg.apiKey
        && cfg.projectId
        && cfg.firestoreDatabaseId
        && String(cfg.apiKey).indexOf('ISI_') === -1
      );
    }

    function escapeHtml(str) {
      const s = (str === null || str === undefined) ? '' : String(str);
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function apakahWarnaCerah(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      if (!m) return false;
      const n = parseInt(m[1], 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      return ((r * 299) + (g * 587) + (b * 114)) / 1000 >= 160;
    }

    function ikonTim(bentuk, ukuran) {
      const u = ukuran || 28;
      if (bentuk === 'lingkaran') {
        return '<svg width="' + u + '" height="' + u + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>';
      }
      if (bentuk === 'berlian') {
        return '<svg width="' + u + '" height="' + u + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2L22 12L12 22L2 12Z"/></svg>';
      }
      if (bentuk === 'kotak') {
        return '<svg width="' + u + '" height="' + u + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
      }
      return '<svg width="' + u + '" height="' + u + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3L22 20H2Z"/></svg>';
    }

    function bacaParameterURL() {
      const p = new URLSearchParams(window.location.search);
      const ruang = (p.get('ruang') || '').replace(/\D/g, '').slice(0, 4);
      const tim = Number(p.get('tim'));
      if (ruang.length === 4) HP_STATE.kodeRuang = ruang;
      if (tim >= 1 && tim <= 4) HP_STATE.timId = tim;
    }

    async function jagaLayarTetapMenyala() {
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && !wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', function() {
            wakeLockSentinel = null;
          });
        }
      } catch (e) {
        /* Abaikan jika browser HP belum mendukung Wake Lock */
      }
    }

    async function testConnection() {
      if (!db) return;
      try {
        await getDocFromServer(doc(db, 'test', 'connection'));
        HP_STATE.onlineFirebase = true;
      } catch (error) {
        if (error instanceof Error && error.message.indexOf('the client is offline') !== -1) {
          if (!HP_STATE.sudahTerimaSnapshot) {
            HP_STATE.onlineFirebase = false;
            HP_STATE.pesanError = 'Koneksi ke server lambat. Pastikan internet HP aktif atau buka lewat Chrome/Safari.';
          }
        }
      }
      renderHP();
    }

    async function kirimPresence(timId, online) {
      if (!db || !HP_STATE.kodeRuang || !timId) return;
      const path = 'ruang/' + HP_STATE.kodeRuang;
      try {
        const payload = {};
        payload['hp.' + timId] = { online: Boolean(online), lastSeen: Math.floor(Date.now()) };
        await updateDoc(doc(db, 'ruang', HP_STATE.kodeRuang), payload);
      } catch (error) {
        if (online && error instanceof Error && error.message.indexOf('Missing or insufficient permissions') !== -1) {
          try {
            handleFirestoreError(error, OperationType.UPDATE, path);
          } catch (logged) {
            HP_STATE.pesanError = 'Akses ruang ditolak. Pastikan menggunakan link publik terbaru.';
            renderHP();
          }
        }
      }
    }

    async function mulaiHeartbeatTim(timId) {
      if (timTerdaftarId && timTerdaftarId !== timId) {
        await kirimPresence(timTerdaftarId, false);
      }
      if (timerHeartbeat) {
        clearInterval(timerHeartbeat);
        timerHeartbeat = null;
      }
      timTerdaftarId = timId;
      await kirimPresence(timId, true);
      timerHeartbeat = setInterval(function() {
        if (HP_STATE.kodeRuang && HP_STATE.timId) {
          kirimPresence(HP_STATE.timId, true);
        }
      }, 15000);
    }

    async function hentikanHeartbeatTim() {
      if (timerHeartbeat) {
        clearInterval(timerHeartbeat);
        timerHeartbeat = null;
      }
      if (timTerdaftarId) {
        const timLama = timTerdaftarId;
        timTerdaftarId = null;
        await kirimPresence(timLama, false);
      }
    }

    function pantauRuang(kode) {
      if (!db || !kode) return;
      if (lepasListenerRuang) {
        lepasListenerRuang();
        lepasListenerRuang = null;
      }

      const path = 'ruang/' + kode;
      lepasListenerRuang = onSnapshot(doc(db, 'ruang', kode), function(snap) {
        HP_STATE.sudahTerimaSnapshot = true;
        HP_STATE.onlineFirebase = true;

        if (!snap.exists()) {
          HP_STATE.ruangTidakAda = true;
          HP_STATE.statusServer = 'tutup';
          HP_STATE.pemenang = null;
          renderHP();
          return;
        }

        const data = snap.data();
        HP_STATE.ruangTidakAda = false;
        HP_STATE.pesanError = '';
        const statusBaru = data.status || 'tutup';
        const baruDibuka = HP_STATE.statusSebelum !== 'buka' && statusBaru === 'buka';

        HP_STATE.statusServer = statusBaru;
        HP_STATE.rondeSoal = Number(data.ronde || 0);
        HP_STATE.pemenang = (data.pemenang === undefined) ? null : data.pemenang;
        HP_STATE.terkunciTim = data.terkunciTim || { 1: false, 2: false, 3: false, 4: false };
        HP_STATE.opsiSalah = Object.assign({ 0: false, 1: false, 2: false, 3: false }, data.opsiSalah || {});
        HP_STATE.opsiTeks = Object.assign({ 0: '', 1: '', 2: '', 3: '' }, data.opsiTeks || {});
        HP_STATE.pilihanHp = (data.pilihanHp === 0 || data.pilihanHp === 1 || data.pilihanHp === 2 || data.pilihanHp === 3)
          ? data.pilihanHp
          : null;
        const ujiData = data.ujiCoba || { aktif: false, hasil: { 1: false, 2: false, 3: false, 4: false } };
        const ujiAktifSekarang = Boolean(ujiData.aktif);
        const hasilSayaSekarang = HP_STATE.timId && ujiData.hasil ? Boolean(ujiData.hasil[String(HP_STATE.timId)]) : false;
        const baruMulaiUjiCoba = ujiAktifSekarang && !hasilSayaSekarang && (!HP_STATE.ujiCobaSebelumAktif || HP_STATE.ujiCobaHasilSebelum);

        HP_STATE.ujiCoba = {
          aktif: ujiAktifSekarang,
          hasil: Object.assign({ 1: false, 2: false, 3: false, 4: false }, ujiData.hasil || {})
        };
        HP_STATE.ujiCobaSebelumAktif = ujiAktifSekarang;
        HP_STATE.ujiCobaHasilSebelum = hasilSayaSekarang;

        HP_STATE.modeTes = Boolean(data.modeTes);
        if (data.namaTim) HP_STATE.namaTim = Object.assign({}, HP_STATE.namaTim, data.namaTim);
        if (data.warnaTim) HP_STATE.warnaTim = Object.assign({}, HP_STATE.warnaTim, data.warnaTim);
        HP_STATE.statusSebelum = statusBaru;

        const terkunci = HP_STATE.timId ? Boolean(HP_STATE.terkunciTim[String(HP_STATE.timId)]) : false;
        if ((baruDibuka && !terkunci || baruMulaiUjiCoba) && navigator.vibrate) {
          try { navigator.vibrate([90, 40, 90]); } catch (e) {}
        }

        if (HP_STATE.timId && HP_STATE.pemenang === HP_STATE.timId && navigator.vibrate) {
          try { navigator.vibrate(180); } catch (e) {}
        }

        renderHP();
      }, function(error) {
        HP_STATE.pesanError = 'Gagal menyinkronkan ruangan. Tekan Sambung Ulang atau cek internet HP.';
        renderHP();
        if (error instanceof Error && error.message.indexOf('Missing or insufficient permissions') !== -1) {
          handleFirestoreError(error, OperationType.GET, path);
        }
      });
    }

    async function gabungRuangan(kodeInput) {
      const kode = String(kodeInput || '').replace(/\D/g, '').slice(0, 4);
      if (kode.length !== 4) {
        HP_STATE.pesanError = 'Masukkan 4 angka kode ruangan dari layar guru.';
        renderHP();
        return;
      }

      HP_STATE.sedangGabung = true;
      HP_STATE.pesanError = '';
      renderHP();
      jagaLayarTetapMenyala();

      const path = 'ruang/' + kode;
      try {
        const snap = await getDoc(doc(db, 'ruang', kode));
        if (!snap.exists()) {
          HP_STATE.pesanError = 'Ruangan ' + kode + ' tidak ditemukan. Cek kode di layar TV guru.';
          HP_STATE.sedangGabung = false;
          renderHP();
          return;
        }
        HP_STATE.kodeRuang = kode;
        HP_STATE.ruangTidakAda = false;
        HP_STATE.sedangGabung = false;
        HP_STATE.onlineFirebase = true;
        pantauRuang(kode);
        if (HP_STATE.timId) {
          await mulaiHeartbeatTim(HP_STATE.timId);
        }
        renderHP();
      } catch (error) {
        HP_STATE.sedangGabung = false;
        HP_STATE.pesanError = 'Tidak bisa terhubung ke Firebase. Cek internet HP lalu coba lagi.';
        renderHP();
        if (error instanceof Error && error.message.indexOf('Missing or insufficient permissions') !== -1) {
          handleFirestoreError(error, OperationType.GET, path);
        }
      }
    }

    async function pilihTim(timId) {
      HP_STATE.timId = timId;
      jagaLayarTetapMenyala();
      renderHP();
      await mulaiHeartbeatTim(timId);
    }

    async function gantiTim() {
      await hentikanHeartbeatTim();
      HP_STATE.timId = null;
      renderHP();
    }

    async function gantiRuangan() {
      await hentikanHeartbeatTim();
      if (lepasListenerRuang) {
        lepasListenerRuang();
        lepasListenerRuang = null;
      }
      HP_STATE.kodeRuang = '';
      HP_STATE.timId = null;
      HP_STATE.ruangTidakAda = false;
      HP_STATE.sudahTerimaSnapshot = false;
      HP_STATE.pesanError = '';
      renderHP();
    }

    function sambungUlangManual() {
      HP_STATE.pesanError = '';
      HP_STATE.onlineFirebase = true;
      if (HP_STATE.kodeRuang) {
        pantauRuang(HP_STATE.kodeRuang);
        if (HP_STATE.timId) {
          mulaiHeartbeatTim(HP_STATE.timId);
        }
      }
      testConnection();
      renderHP();
    }

    /* Tekan tombol REBUT! menggunakan Firestore runTransaction atau Uji Coba check-in */
    async function tekanTombolRebut() {
      if (!db || !HP_STATE.kodeRuang || !HP_STATE.timId) return;

      /* Mode Uji Coba Rebutan (semua 4 HP aktif bersamaan & mengirim konfirmasi ke layar guru) */
      if (HP_STATE.ujiCoba && HP_STATE.ujiCoba.aktif) {
        const sudahSaya = Boolean(HP_STATE.ujiCoba.hasil && HP_STATE.ujiCoba.hasil[String(HP_STATE.timId)]);
        if (sudahSaya || HP_STATE.sedangTransaksi) return;

        const sekarangUji = Date.now();
        if (sekarangUji - HP_STATE.waktuTekanTerakhir < 300) return;
        HP_STATE.waktuTekanTerakhir = sekarangUji;
        HP_STATE.sedangTransaksi = true;
        HP_STATE.pesanError = '';
        jagaLayarTetapMenyala();

        if (navigator.vibrate) {
          try { navigator.vibrate(55); } catch (e) {}
        }

        if (timerTransaksiAman) clearTimeout(timerTransaksiAman);
        timerTransaksiAman = setTimeout(function() {
          if (HP_STATE.sedangTransaksi) {
            HP_STATE.sedangTransaksi = false;
            renderHP();
          }
        }, 3500);

        renderHP();

        const pathUji = 'ruang/' + HP_STATE.kodeRuang;
        const ruangRefUji = doc(db, 'ruang', HP_STATE.kodeRuang);
        try {
          const payloadUji = {};
          payloadUji['ujiCoba.hasil.' + HP_STATE.timId] = true;
          await updateDoc(ruangRefUji, payloadUji);
        } catch (error) {
          if (error instanceof Error && error.message.indexOf('Missing or insufficient permissions') !== -1) {
            HP_STATE.pesanError = 'Gagal mengirim uji coba (izin ditolak).';
            handleFirestoreError(error, OperationType.UPDATE, pathUji);
          } else {
            HP_STATE.pesanError = 'Sinyal tersendat. Tekan tombol uji coba lagi!';
          }
        } finally {
          if (timerTransaksiAman) {
            clearTimeout(timerTransaksiAman);
            timerTransaksiAman = null;
          }
          HP_STATE.sedangTransaksi = false;
          renderHP();
        }
        return;
      }

      if (HP_STATE.statusServer !== 'buka') return;
      if (HP_STATE.pemenang !== null) return;
      if (HP_STATE.terkunciTim && HP_STATE.terkunciTim[String(HP_STATE.timId)]) return;
      if (HP_STATE.sedangTransaksi) return;

      /* Dedupe multi-event (touchstart + pointerdown + click) dalam 300ms */
      const sekarang = Date.now();
      if (sekarang - HP_STATE.waktuTekanTerakhir < 300) return;
      HP_STATE.waktuTekanTerakhir = sekarang;
      HP_STATE.sedangTransaksi = true;
      HP_STATE.pesanError = '';
      jagaLayarTetapMenyala();

      if (navigator.vibrate) {
        try { navigator.vibrate(45); } catch (e) {}
      }

      if (timerTransaksiAman) clearTimeout(timerTransaksiAman);
      timerTransaksiAman = setTimeout(function() {
        if (HP_STATE.sedangTransaksi) {
          HP_STATE.sedangTransaksi = false;
          renderHP();
        }
      }, 3000);

      renderHP();

      const path = 'ruang/' + HP_STATE.kodeRuang;
      const ruangRef = doc(db, 'ruang', HP_STATE.kodeRuang);
      try {
        await runTransaction(db, async function(tx) {
          const snap = await tx.get(ruangRef);
          if (!snap.exists()) return;
          const d = snap.data();
          if (d.status !== 'buka') return;
          if (d.pemenang !== null && d.pemenang !== undefined) return;
          if (d.terkunciTim && d.terkunciTim[String(HP_STATE.timId)] === true) return;
          tx.update(ruangRef, {
            pemenang: HP_STATE.timId,
            status: 'terkunci',
            waktuMenang: serverTimestamp()
          });
        });
      } catch (error) {
        if (error instanceof Error && error.message.indexOf('Missing or insufficient permissions') !== -1) {
          HP_STATE.pesanError = 'Gagal mengirim rebutan (izin ditolak).';
          handleFirestoreError(error, OperationType.UPDATE, path);
        } else {
          HP_STATE.pesanError = 'Sinyal tersendat. Tekan tombol REBUT lagi!';
        }
      } finally {
        if (timerTransaksiAman) {
          clearTimeout(timerTransaksiAman);
          timerTransaksiAman = null;
        }
        HP_STATE.sedangTransaksi = false;
        renderHP();
      }
    }

    async function pilihOpsiDariHP(idxOpsi) {
      if (!db || !HP_STATE.kodeRuang || !HP_STATE.timId) return;
      if (HP_STATE.modeTes || (HP_STATE.ujiCoba && HP_STATE.ujiCoba.aktif)) return;
      if (HP_STATE.statusServer !== 'terkunci' || HP_STATE.pemenang !== HP_STATE.timId) return;
      if (HP_STATE.opsiSalah && HP_STATE.opsiSalah[String(idxOpsi)]) return;

      HP_STATE.pilihanHp = idxOpsi;
      HP_STATE.pesanError = '';
      renderHP();

      const path = 'ruang/' + HP_STATE.kodeRuang;
      try {
        await updateDoc(doc(db, 'ruang', HP_STATE.kodeRuang), {
          pilihanHp: idxOpsi
        });
      } catch (error) {
        if (error instanceof Error && error.message.indexOf('Missing or insufficient permissions') !== -1) {
          HP_STATE.pesanError = 'Opsi tersebut sudah dinonaktifkan atau giliran sudah berubah.';
          handleFirestoreError(error, OperationType.UPDATE, path);
        } else {
          HP_STATE.pesanError = 'Pilihan belum tersinkron. Coba ketuk sekali lagi.';
        }
        renderHP();
      }
    }

    function renderHP() {
      const root = document.getElementById('app-hp');
      if (!root) return;

      if (!HP_STATE.configValid) {
        root.style.backgroundColor = '#077482';
        root.innerHTML =
          '<div class="judul-layar">' +
            '<h1>Detektif Inferensial Cup</h1>' +
            '<p>Tombol Rebutan HP</p>' +
          '</div>' +
          '<div class="kotak-kode">' +
            '<div class="pesan-error">Konfigurasi Firebase belum aktif. Hubungi guru untuk memeriksa pengaturan aplikasi.</div>' +
          '</div>';
        return;
      }

      if (!HP_STATE.kodeRuang || HP_STATE.ruangTidakAda) {
        root.style.backgroundColor = '#077482';
        const pesan = HP_STATE.ruangTidakAda
          ? 'Ruangan tidak ditemukan atau sudah diganti guru. Masukkan kode ruangan baru dari layar TV.'
          : HP_STATE.pesanError;

        root.innerHTML =
          '<div class="judul-layar">' +
            '<h1>Detektif Inferensial Cup</h1>' +
            '<p>Masukkan kode ruangan 4 digit yang tampil di layar guru</p>' +
          '</div>' +
          '<form id="form-kode-ruang" class="kotak-kode">' +
            (pesan ? '<div class="pesan-error">' + escapeHtml(pesan) + '</div>' : '') +
            '<input id="input-kode-ruang" class="input-kode-ruang" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" value="' + escapeHtml(HP_STATE.kodeRuang) + '" autocomplete="off" />' +
            '<button id="btn-gabung-ruang" type="submit" class="tombol-gabung" ' + (HP_STATE.sedangGabung ? 'disabled' : '') + '>' +
              (HP_STATE.sedangGabung ? 'Memeriksa ruangan...' : 'Masuk Ruangan') +
            '</button>' +
          '</form>';

        const form = document.getElementById('form-kode-ruang');
        const input = document.getElementById('input-kode-ruang');
        if (input) {
          input.addEventListener('input', function() {
            input.value = input.value.replace(/\D/g, '').slice(0, 4);
          });
        }
        if (form) {
          form.addEventListener('submit', function(e) {
            e.preventDefault();
            gabungRuangan(input ? input.value : '');
          });
        }
        return;
      }

      if (!HP_STATE.timId) {
        root.style.backgroundColor = '#077482';
        let kartuTim = '';
        for (let i = 0; i < TIM_DEFAULT.length; i++) {
          const t = TIM_DEFAULT[i];
          const nama = HP_STATE.namaTim[String(t.id)] || t.nama;
          const warna = HP_STATE.warnaTim[String(t.id)] || t.warna;
          const gayaPilih = apakahWarnaCerah(warna)
            ? 'background-color:' + warna + '; color:#1E242B; border-color:rgba(30,36,43,0.35);'
            : 'background-color:' + warna + ';';
          kartuTim +=
            '<button type="button" class="tombol-pilih-tim" data-pilih-tim="' + t.id + '" style="' + gayaPilih + '">' +
              ikonTim(t.bentuk, 30) +
              '<span>' + escapeHtml(nama) + '</span>' +
            '</button>';
        }

        root.innerHTML =
          '<div class="judul-layar" style="display:flex; justify-content:space-between; align-items:center; text-align:left; gap:8px;">' +
            '<div>' +
              '<h1 style="font-size:1.3rem;">Ruang ' + escapeHtml(HP_STATE.kodeRuang) + '</h1>' +
              '<p>Pilih kelompok kamu</p>' +
            '</div>' +
            '<button id="btn-ganti-ruang-awal" type="button" class="tombol-kecil-hp">Ganti Kode</button>' +
          '</div>' +
          (HP_STATE.pesanError ? '<div class="pesan-error">' + escapeHtml(HP_STATE.pesanError) + '</div>' : '') +
          '<div class="daftar-pilih-tim">' + kartuTim + '</div>';

        const btnGantiRuang = document.getElementById('btn-ganti-ruang-awal');
        if (btnGantiRuang) btnGantiRuang.addEventListener('click', gantiRuangan);
        const tombolTimList = root.querySelectorAll('[data-pilih-tim]');
        for (let i = 0; i < tombolTimList.length; i++) {
          (function(el) {
            el.addEventListener('click', function() {
              pilihTim(Number(el.getAttribute('data-pilih-tim')));
            });
          })(tombolTimList[i]);
        }
        return;
      }

      const tid = HP_STATE.timId;
      const cfg = TIM_DEFAULT[tid - 1];
      const namaTim = HP_STATE.namaTim[String(tid)] || cfg.nama;
      const warnaTim = HP_STATE.warnaTim[String(tid)] || cfg.warna;
      const terkunciSoalIni = Boolean(HP_STATE.terkunciTim && HP_STATE.terkunciTim[String(tid)]);
      const adaPemenang = HP_STATE.pemenang !== null && HP_STATE.pemenang !== undefined;
      const ujiAktif = Boolean(HP_STATE.ujiCoba && HP_STATE.ujiCoba.aktif);
      const ujiBerhasil = Boolean(ujiAktif && HP_STATE.ujiCoba.hasil && HP_STATE.ujiCoba.hasil[String(tid)]);

      root.style.backgroundColor = warnaTim;

      const warnaCerah = apakahWarnaCerah(warnaTim);
      const gayaWarnaTim = warnaCerah
        ? 'background-color: ' + warnaTim + '; color: #1E242B; border-color: rgba(30, 36, 43, 0.35);'
        : 'background-color: ' + warnaTim + ';';

      let kelasTombol = 'tutup';
      let gayaTombol = '';
      let teksUtama = 'Tunggu...';
      let teksSub = 'Menunggu guru membuka rebutan';
      let bisaTekan = false;

      if (!HP_STATE.onlineFirebase && !HP_STATE.sudahTerimaSnapshot) {
        kelasTombol = 'tutup';
        teksUtama = 'Menyambung...';
        teksSub = 'Memeriksa koneksi ke server rebutan';
      } else if (ujiAktif) {
        if (ujiBerhasil) {
          kelasTombol = 'menang';
          gayaTombol = 'background-color: #15803D;';
          teksUtama = 'BERHASIL! ✓';
          teksSub = 'Respons terkirim & tercatat di layar guru';
        } else {
          kelasTombol = 'buka';
          gayaTombol = gayaWarnaTim;
          teksUtama = HP_STATE.sedangTransaksi ? 'Mengirim...' : 'UJI COBA: TEKAN!';
          teksSub = 'Tekan tombol ini untuk menguji koneksi ke layar guru';
          bisaTekan = true;
        }
      } else if (adaPemenang || HP_STATE.statusServer === 'terkunci') {
        if (HP_STATE.pemenang === tid) {
          kelasTombol = 'menang';
          gayaTombol = gayaWarnaTim;
          teksUtama = 'KAMU TERCEPAT!';
          teksSub = HP_STATE.modeTes ? 'Tes berhasil! Koneksi HP mantap.' : 'Maju ke depan!';
        } else {
          kelasTombol = 'kalah';
          const pId = HP_STATE.pemenang;
          const namaPemenang = pId ? (HP_STATE.namaTim[String(pId)] || ('Kelompok ' + pId)) : 'Kelompok lain';
          teksUtama = escapeHtml(namaPemenang) + ' lebih cepat';
          teksSub = terkunciSoalIni
            ? 'Kelompok kamu terkunci untuk soal ini'
            : 'Bersiap bila ada rebutan ulang';
        }
      } else if (terkunciSoalIni) {
        kelasTombol = 'kalah';
        teksUtama = 'Terkunci';
        teksSub = 'Kelompok kamu sudah gagal pada soal ini. Tunggu soal berikutnya.';
      } else if (HP_STATE.statusServer === 'buka') {
        kelasTombol = 'buka';
        gayaTombol = gayaWarnaTim;
        teksUtama = HP_STATE.sedangTransaksi ? 'Mengirim...' : 'REBUT!';
        teksSub = HP_STATE.modeTes ? 'TES REBUTAN — Tekan secepatnya!' : 'Tekan sekarang untuk merebut!';
        bisaTekan = true;
      }

      const gayaBawah = warnaCerah
        ? 'background-color: rgba(0, 53, 59, 0.72); padding: 6px 12px; border-radius: 12px; color: #FFFFFF;'
        : '';

      const adaOpsiSoal = !ujiAktif
        && !HP_STATE.modeTes
        && HP_STATE.rondeSoal > 0
        && (Boolean(HP_STATE.opsiTeks['0']) || Boolean(HP_STATE.opsiTeks['1']) || Boolean(HP_STATE.opsiTeks['2']) || Boolean(HP_STATE.opsiTeks['3']));
      const sayaPenjawab = !ujiAktif && !HP_STATE.modeTes && HP_STATE.statusServer === 'terkunci' && HP_STATE.pemenang === tid;
      const hurufOpsi = ['A', 'B', 'C', 'D'];
      let panelOpsiHtml = '';
      if (adaOpsiSoal) {
        let daftarOpsiHtml = '';
        let jumlahSalah = 0;
        for (let idx = 0; idx < 4; idx++) {
          const teksOpsi = HP_STATE.opsiTeks[String(idx)] || ('Opsi ' + hurufOpsi[idx]);
          const sudahSalah = Boolean(HP_STATE.opsiSalah && HP_STATE.opsiSalah[String(idx)]);
          if (sudahSalah) jumlahSalah += 1;
          const sedangDipilih = !sudahSalah && HP_STATE.pilihanHp === idx;
          const bolehKlikOpsi = sayaPenjawab && !sudahSalah;
          const kelasItem = 'opsi-hp-item' + (sudahSalah ? ' salah' : (sedangDipilih ? ' dipilih' : ''));
          const labelTag = sudahSalah ? '✗ Salah' : (sedangDipilih ? 'Dipilih' : (bolehKlikOpsi ? 'Pilih' : 'Tersedia'));
          daftarOpsiHtml +=
            '<button type="button" class="' + kelasItem + '" ' + (bolehKlikOpsi ? 'data-opsi-hp="' + idx + '"' : 'disabled') + '>' +
              '<span class="opsi-hp-huruf">' + (sudahSalah ? '✗' : hurufOpsi[idx]) + '</span>' +
              '<span class="opsi-hp-teks">' + escapeHtml(teksOpsi) + '</span>' +
              '<span class="opsi-hp-tag">' + labelTag + '</span>' +
            '</button>';
        }

        panelOpsiHtml =
          '<section class="panel-opsi-hp" aria-label="Pilihan Jawaban Ronde 2">' +
            '<div class="judul-panel-opsi-hp">' +
              '<span>' + (sayaPenjawab ? 'Pilih Opsi Tersisa (Tersinkron ke Layar)' : 'Opsi Soal #' + HP_STATE.rondeSoal) + '</span>' +
              '<span>' + (4 - jumlahSalah) + '/4 tersisa</span>' +
            '</div>' +
            '<div class="daftar-opsi-hp">' + daftarOpsiHtml + '</div>' +
          '</section>';
      }

      root.innerHTML =
        '<header class="header-hp">' +
          '<div class="info-tim-hp">' +
            ikonTim(cfg.bentuk, 24) +
            '<div style="min-width:0;">' +
              '<div class="nama-tim-hp">' + escapeHtml(namaTim) + '</div>' +
              '<div class="sub-kode-hp">Ruang ' + escapeHtml(HP_STATE.kodeRuang) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="kanan-header-hp">' +
            '<span class="status-koneksi">' +
              '<span class="titik ' + (HP_STATE.onlineFirebase ? 'nyala' : '') + '"></span>' +
              '<span>' + (HP_STATE.onlineFirebase ? 'Online' : 'Offline') + '</span>' +
            '</span>' +
            '<button id="btn-ganti-tim" type="button" class="tombol-kecil-hp">Ganti</button>' +
          '</div>' +
        '</header>' +
        (HP_STATE.pesanError ? '<div class="pesan-error">' + escapeHtml(HP_STATE.pesanError) + '</div>' : '') +
        '<main class="area-tombol-raksasa">' +
          '<button id="btn-rebut-utama" type="button" class="tombol-rebut ' + kelasTombol + '" style="' + gayaTombol + '" ' + (bisaTekan ? '' : 'disabled') + '>' +
            '<span class="teks-utama-tombol">' + teksUtama + '</span>' +
            '<span class="teks-sub-tombol">' + teksSub + '</span>' +
          '</button>' +
        '</main>' +
        panelOpsiHtml +
        '<div class="bar-bantuan-bawah" style="' + gayaBawah + '">' +
          '<button id="btn-sambung-ulang" type="button" class="tombol-kecil-hp">Sambung Ulang</button>' +
          '<span>Bila macet, buka lewat Chrome / Safari</span>' +
        '</div>';

      const btnGantiTim = document.getElementById('btn-ganti-tim');
      if (btnGantiTim) btnGantiTim.addEventListener('click', gantiTim);

      const btnSambung = document.getElementById('btn-sambung-ulang');
      if (btnSambung) btnSambung.addEventListener('click', sambungUlangManual);

      const btn = document.getElementById('btn-rebut-utama');
      if (btn && bisaTekan) {
        btn.addEventListener('touchstart', tekanTombolRebut, { passive: true });
        btn.addEventListener('pointerdown', tekanTombolRebut);
        btn.addEventListener('click', tekanTombolRebut);
      }

      const opsiHpList = root.querySelectorAll('[data-opsi-hp]');
      for (let j = 0; j < opsiHpList.length; j++) {
        (function(el) {
          el.addEventListener('click', function() {
            pilihOpsiDariHP(Number(el.getAttribute('data-opsi-hp')));
          });
        })(opsiHpList[j]);
      }
    }

    async function mulaiHP() {
      bacaParameterURL();
      HP_STATE.configValid = apakahConfigTerisi(firebaseConfig);
      if (!HP_STATE.configValid) {
        renderHP();
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        try {
          db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true }, firebaseConfig.firestoreDatabaseId);
        } catch (eInit) {
          db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
        }

        window.addEventListener('online', async function() {
          HP_STATE.onlineFirebase = true;
          if (HP_STATE.kodeRuang) {
            pantauRuang(HP_STATE.kodeRuang);
            if (HP_STATE.timId) await mulaiHeartbeatTim(HP_STATE.timId);
          }
          renderHP();
        });
        window.addEventListener('offline', function() {
          HP_STATE.onlineFirebase = false;
          renderHP();
        });
        window.addEventListener('pagehide', function() {
          if (timTerdaftarId) kirimPresence(timTerdaftarId, false);
        });

        /* Jalankan pantauan ruangan langsung tanpa memblokir pada testConnection */
        if (HP_STATE.kodeRuang) {
          pantauRuang(HP_STATE.kodeRuang);
          if (HP_STATE.timId) {
            mulaiHeartbeatTim(HP_STATE.timId);
          }
        }
        testConnection();
      } catch (err) {
        HP_STATE.pesanError = 'Gagal memuat Firebase di browser ini. Coba buka memakai Google Chrome atau Safari.';
      }
      renderHP();
    }

    mulaiHP();
  </script>
</body>
