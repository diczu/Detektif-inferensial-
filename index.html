<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detektif Inferensial Cup — Kuis Pemahaman Inferensial Kelas 9</title>
  <meta name="description" content="Webapp kuis turnamen kelas berbahasa Indonesia untuk siswa SMP kelas 9 materi Pemahaman Inferensial." />
  <meta property="og:title" content="Detektif Inferensial Cup" />
  <meta property="og:description" content="Kuis turnamen kelas SMP kelas 9 materi TKA Bahasa Indonesia: Pemahaman Inferensial." />
  <meta property="og:type" content="website" />

  <!-- Font Poppins sesuai acuan desain & JetBrains Mono untuk angka skor/timer -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       SISTEM WARNA & TIPOGRAFI SEDERHANA (Teal, Aqua Lembut, Amber Hangat, Putih)
       ========================================================================= */
    :root {
      --bg-kanvas: #F7FBFC;
      --bg-krem: #EAF7F9;
      --bg-kertas: #FFFFFF;
      --bg-kertas-hangat: #FFF7EB;
      --teal-gelap: #00464D;
      --teal-utama: #077482;
      --teal-cerah: #179CA8;
      --biru-tua: #077482;
      --biru-sedang: #EAF7F9;
      --biru-halus: #E1F4F7;
      --mustard: #FA9E2D;
      --mustard-gelap: #D97706;
      --mustard-lembut: #FFF3E0;
      --teks-utama: #1E242B;
      --teks-sekunder: #4B5563;
      --garis-halus: #D5E6E8;
      --hijau-benar: #15803D;
      --hijau-latar: #DCFCE7;
      --merah-salah: #B91C1C;
      --merah-latar: #FEE2E2;

      --tim-0: #DC2626;
      --tim-0-latar: #FEF2F2;
      --tim-1: #0284C7;
      --tim-1-latar: #EFF6FF;
      --tim-2: #15803D;
      --tim-2-latar: #F0FDF4;
      --tim-3: #EAB308;
      --tim-3-latar: #FEFCE8;

      --font-judul: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-isi: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-angka: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

      --radius-kartu: 18px;
      --radius-tombol: 12px;
      --bayangan-kartu: 0 4px 18px rgba(7, 116, 130, 0.08);
      --transisi-cepat: 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-kanvas);
      color: var(--teks-utama);
      font-family: var(--font-isi);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input, select {
      font-family: inherit;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--mustard);
      outline-offset: 2px;
    }

    .wadah-aplikasi {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-kanvas);
    }

    /* =========================================================================
       BILAH ATAS & PAPAN SKOR RINGKAS
       ========================================================================= */
    .bilah-atas {
      background-color: #FFFFFF;
      color: var(--teks-utama);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 5px solid var(--teal-utama);
      border-bottom: 1px solid var(--garis-halus);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .merek-judul {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .merek-ikon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background-color: var(--teal-utama);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .merek-nama {
      font-family: var(--font-judul);
      font-size: clamp(1rem, 1.3vw, 1.25rem);
      font-weight: 700;
      color: var(--teal-utama);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .aksi-atas {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tombol-utilitas {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--garis-halus);
      background-color: #FFFFFF;
      color: var(--teks-utama);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--transisi-cepat), border-color var(--transisi-cepat);
    }

    .tombol-utilitas:hover:not(:disabled) {
      background-color: var(--bg-krem);
      border-color: var(--teal-utama);
    }

    .tombol-utilitas:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tombol-guru {
      background-color: var(--teal-utama);
      color: #FFFFFF;
      border-color: var(--teal-utama);
      font-weight: 600;
    }

    .tombol-guru:hover:not(:disabled) {
      background-color: var(--teal-gelap);
      border-color: var(--teal-gelap);
    }

    /* Papan Skor */
    .papan-skor {
      background-color: var(--bg-krem);
      padding: 10px 24px;
      border-bottom: 1px solid var(--garis-halus);
    }

    .papan-skor-grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .kartu-skor-tim {
      background-color: #FFFFFF;
      color: var(--teks-utama);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1.5px solid var(--garis-halus);
      transition: border-color var(--transisi-cepat), box-shadow var(--transisi-cepat), opacity var(--transisi-cepat);
    }

    .kartu-skor-tim.sedang-giliran {
      border-color: var(--mustard);
      background-color: #FFFDF8;
      box-shadow: 0 0 0 2px rgba(250, 158, 45, 0.28);
    }

    .kartu-skor-tim.penonton {
      opacity: 0.48;
      background-color: #F1F5F9;
    }

    .info-tim-kiri {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .lencana-ikon-tim {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .detail-nama-tim {
      min-width: 0;
    }

    .nama-tim-teks {
      font-family: var(--font-judul);
      font-weight: 700;
      font-size: clamp(0.95rem, 1.2vw, 1.12rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-tim-teks {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--teks-sekunder);
      margin-top: 1px;
    }

    .status-tim-teks.giliran-aktif {
      color: var(--teal-utama);
      font-weight: 700;
    }

    .streak-meter {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .streak-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--teks-sekunder);
      margin-right: 4px;
    }

    .streak-batang {
      width: 14px;
      height: 6px;
      border-radius: 3px;
      background-color: #E2E8F0;
    }

    .streak-batang.isi {
      background-color: var(--mustard);
    }

    .angka-skor-tim {
      font-family: var(--font-angka);
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.45rem, 2.2vw, 2rem);
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
      transition: transform 180ms ease;
    }

    .angka-skor-tim.berdenyut {
      transform: scale(1.14);
    }

    /* =========================================================================
       KONTEN UTAMA & FOOTER AKSEN TIPIS
       ========================================================================= */
    .area-utama {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
    }

    .bilah-bawah-aksen {
      background-color: var(--mustard);
      color: var(--teks-utama);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .layar-masuk {
      animation: munculHalus 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes munculHalus {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .kartu-besar {
      background-color: var(--bg-kertas);
      border-radius: var(--radius-kartu);
      border: 1px solid var(--garis-halus);
      box-shadow: var(--bayangan-kartu);
      padding: 24px 28px;
    }

    /* =========================================================================
       LAYAR 1: SETUP (Terinspirasi Halaman Judul Template Teal + Bar Amber)
       ========================================================================= */
    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 24px;
      align-items: stretch;
      margin: auto 0;
    }

    .hero-detektif {
      background: linear-gradient(145deg, var(--teal-utama) 0%, var(--teal-cerah) 100%);
      color: #FFFFFF;
      border-radius: var(--radius-kartu);
      padding: 32px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }

    .hero-meta-bar {
      font-size: 0.9rem;
      font-weight: 600;
      color: #DDF7FA;
      margin-bottom: 6px;
    }

    .hero-judul {
      font-family: var(--font-judul);
      font-size: clamp(2rem, 3.2vw, 2.85rem);
      font-weight: 800;
      line-height: 1.12;
      margin: 0 0 10px;
      text-wrap: balance;
    }

    .hero-deskripsi {
      font-size: 1rem;
      color: #ECFEFF;
      max-width: 44ch;
      margin: 0;
      opacity: 0.95;
    }

    .daftar-bar-ronde {
      display: grid;
      gap: 10px;
    }

    .bar-ronde-hero {
      background-color: var(--mustard);
      color: var(--teks-utama);
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 0.96rem;
    }

    .form-setup {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .judul-bagian {
      font-family: var(--font-judul);
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 10px;
      color: var(--teal-utama);
    }

    .daftar-input-tim {
      display: grid;
      gap: 10px;
    }

    .baris-input-tim {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-kanvas);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--garis-halus);
    }

    .input-teks-tim {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--teks-utama);
      padding: 5px 4px;
    }

    .opsi-pengaturan-baris {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .grup-kontrol {
      background-color: var(--bg-kanvas);
      border: 1px solid var(--garis-halus);
      border-radius: 12px;
      padding: 12px;
    }

    .label-kontrol {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--teks-sekunder);
      margin-bottom: 8px;
    }

    .pilihan-segmen {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tombol-segmen {
      flex: 1;
      min-width: 56px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--garis-halus);
      background-color: #FFFFFF;
      color: var(--teks-utama);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all var(--transisi-cepat);
      white-space: nowrap;
    }

    .tombol-segmen.aktif {
      background-color: var(--teal-utama);
      color: #FFFFFF;
      border-color: var(--teal-utama);
    }

    .baris-aksi-setup {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 4px;
    }

    /* =========================================================================
       TOMBOL UTAMA & SEKUNDER
       ========================================================================= */
    .tombol-primer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      min-height: 52px;
      border-radius: var(--radius-tombol);
      border: none;
      background-color: var(--mustard);
      color: var(--teks-utama);
      font-family: var(--font-judul);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform var(--transisi-cepat), background-color var(--transisi-cepat);
    }

    .tombol-primer:hover:not(:disabled) {
      background-color: var(--amber-hover, #F28B18);
      transform: translateY(-1px);
    }

    .tombol-primer:active:not(:disabled) {
      transform: translateY(1px);
    }

    .tombol-primer:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .tombol-sekunder {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      min-height: 50px;
      border-radius: var(--radius-tombol);
      border: 1.5px solid var(--teal-utama);
      background-color: #FFFFFF;
      color: var(--teal-utama);
      font-family: var(--font-judul);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--transisi-cepat);
    }

    .tombol-sekunder:hover {
      background-color: var(--bg-krem);
    }

    /* =========================================================================
       LAYAR 2: JUDUL RONDE (Kartu Aturan Horizontal Aqua seperti Slide 5)
       ========================================================================= */
    .layar-judul-ronde {
      margin: auto;
      width: 100%;
      max-width: 820px;
      text-align: center;
      padding: 36px 32px;
    }

    .kicker-ronde {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--teal-cerah);
      margin-bottom: 6px;
    }

    .judul-ronde-besar {
      font-family: var(--font-judul);
      font-size: clamp(1.9rem, 3.4vw, 2.8rem);
      font-weight: 800;
      color: var(--teal-utama);
      margin: 0 0 8px;
      text-wrap: balance;
    }

    .subjudul-ronde {
      font-size: 1.08rem;
      color: var(--teks-sekunder);
      margin: 0 0 24px;
    }

    .daftar-aturan-ronde {
      text-align: left;
      max-width: 640px;
      margin: 0 auto 26px;
      display: grid;
      gap: 10px;
    }

    .item-aturan-ronde {
      display: flex;
      align-items: center;
      gap: 14px;
      background-color: var(--bg-krem);
      border: 1px solid #BEE3E7;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: clamp(0.98rem, 1.2vw, 1.1rem);
      font-weight: 500;
    }

    .nomor-aturan {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--teal-utama);
      color: #FFFFFF;
      font-family: var(--font-angka);
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* =========================================================================
       LAYAR 3: SOAL (Gaya Quick Check: Kartu Putih + Opsi Blok Amber Kiri)
       ========================================================================= */
    .baris-status-soal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .banner-giliran {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 12px;
      background-color: #FFFFFF;
      border: 1.5px solid var(--garis-halus);
      font-family: var(--font-judul);
      font-size: clamp(1rem, 1.4vw, 1.25rem);
      font-weight: 700;
    }

    .info-soal-kanan {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .meta-soal-teks {
      text-align: right;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--teks-sekunder);
    }

    /* Timer Melingkar */
    .timer-lingkar {
      position: relative;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .timer-lingkar svg {
      transform: rotate(-90deg);
      width: 68px;
      height: 68px;
    }

    .timer-angka {
      position: absolute;
      font-family: var(--font-angka);
      font-variant-numeric: tabular-nums;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--teal-utama);
    }

    .timer-lingkar.kritis .timer-angka {
      color: var(--merah-salah);
      animation: denyutTimer 700ms ease-in-out infinite;
    }

    @keyframes denyutTimer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Panel Rebutan Ronde 2 */
    .panel-rebutan {
      background-color: var(--teal-utama);
      color: #FFFFFF;
      border-radius: var(--radius-kartu);
      padding: 20px 24px;
      margin-bottom: 16px;
      text-align: center;
    }

    .panel-rebutan h3 {
      font-family: var(--font-judul);
      font-size: clamp(1.2rem, 1.8vw, 1.55rem);
      margin: 0 0 4px;
      color: #FFFFFF;
    }

    .panel-rebutan p {
      margin: 0 0 14px;
      color: #DDF7FA;
      font-size: 0.98rem;
    }

    .grid-tombol-rebutan {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .tombol-rebutan-tim {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      min-height: 62px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      font-family: var(--font-judul);
      font-size: clamp(1rem, 1.35vw, 1.2rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--transisi-cepat), filter var(--transisi-cepat);
    }

    .tombol-rebutan-tim:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    /* Kartu Teks Bacaan (Dengan header tab teal tipis seperti slide materi) */
    .kartu-teks-bacaan {
      background-color: #FFFFFF;
      border: 1px solid var(--garis-halus);
      border-top: 6px solid var(--teal-utama);
      border-radius: var(--radius-kartu);
      padding: 22px 26px;
      box-shadow: var(--bayangan-kartu);
      margin-bottom: 16px;
    }

    .label-lo-tipe {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--teal-utama);
      margin-bottom: 8px;
    }

    .paragraf-soal {
      font-size: clamp(1.12rem, 1.6vw, 1.4rem);
      line-height: 1.65;
      color: var(--teks-utama);
      margin: 0 0 14px;
    }

    .kalimat-relevan-sorot {
      background-color: var(--mustard-lembut);
      border-radius: 5px;
      padding: 2px 5px;
      font-weight: 600;
    }

    .kotak-kosong-berkedip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      padding: 2px 12px;
      margin: 0 4px;
      border-radius: 8px;
      border: 2px dashed var(--mustard-gelap);
      background-color: var(--mustard-lembut);
      color: var(--teks-utama);
      font-family: var(--font-angka);
      font-weight: 700;
      animation: kedipKotak 1.3s ease-in-out infinite;
    }

    @keyframes kedipKotak {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .pertanyaan-inti {
      font-family: var(--font-judul);
      font-size: clamp(1.18rem, 1.7vw, 1.5rem);
      font-weight: 700;
      color: var(--teal-gelap);
      margin: 0;
      padding-top: 14px;
      border-top: 1px solid var(--garis-halus);
    }

    /* Grid Pilihan Jawaban ala Quick Check (Blok huruf amber di kiri + teks putih di kanan) */
    .grid-opsi {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .tombol-opsi {
      display: flex;
      align-items: stretch;
      text-align: left;
      padding: 0;
      min-height: 76px;
      border-radius: 14px;
      border: 1.5px solid var(--mustard-gelap);
      background-color: #FFFFFF;
      color: var(--teks-utama);
      font-size: clamp(1rem, 1.35vw, 1.2rem);
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      overflow: hidden;
      transition: transform var(--transisi-cepat), border-color var(--transisi-cepat), background-color var(--transisi-cepat);
    }

    .tombol-opsi:hover:not(:disabled) {
      border-color: var(--teal-utama);
      background-color: var(--bg-krem);
      transform: translateY(-1px);
    }

    .tombol-opsi.dipilih {
      border-color: var(--teal-utama);
      background-color: var(--bg-krem);
      box-shadow: 0 0 0 2px rgba(7, 116, 130, 0.25);
    }

    .tombol-opsi:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .huruf-opsi {
      width: 58px;
      background-color: var(--mustard);
      color: var(--teks-utama);
      font-family: var(--font-judul);
      font-size: 1.35rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-right: 1.5px solid rgba(0, 0, 0, 0.08);
      transition: background-color var(--transisi-cepat), color var(--transisi-cepat);
    }

    .tombol-opsi.dipilih .huruf-opsi {
      background-color: var(--teal-utama);
      color: #FFFFFF;
    }

    .teks-opsi-isi {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      flex: 1;
    }

    /* Area Tombol Kunci Jawaban */
    .zona-kunci-jawaban {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 18px;
      background-color: #FFFFFF;
      border: 1px solid var(--garis-halus);
      border-radius: 14px;
      flex-wrap: wrap;
    }

    .petunjuk-kunci {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--teks-sekunder);
    }

    .tombol-kunci-besar {
      min-width: 230px;
      min-height: 52px;
      font-size: 1.1rem;
      padding: 12px 26px;
    }

    /* =========================================================================
       LAYAR 4: PEMBAHASAN
       ========================================================================= */
    .banner-hasil-jawaban {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 22px;
      border-radius: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .banner-hasil-jawaban.benar {
      background-color: var(--hijau-latar);
      border: 1.5px solid var(--hijau-benar);
      color: #14532D;
    }

    .banner-hasil-jawaban.salah {
      background-color: var(--merah-latar);
      border: 1.5px solid var(--merah-salah);
      color: #7F1D1D;
    }

    .judul-hasil-jawaban {
      font-family: var(--font-judul);
      font-size: clamp(1.25rem, 1.8vw, 1.6rem);
      font-weight: 700;
      margin: 0;
    }

    .poin-perubahan {
      font-family: var(--font-angka);
      font-size: 1.35rem;
      font-weight: 700;
    }

    .grid-pembahasan {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .kartu-kunci-alasan {
      background-color: #FFFFFF;
      border: 1px solid var(--garis-halus);
      border-radius: var(--radius-kartu);
      padding: 20px 22px;
      box-shadow: var(--bayangan-kartu);
    }

    .kotak-kunci-benar {
      background-color: var(--hijau-latar);
      border: 1px solid var(--hijau-benar);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #14532D;
      margin-bottom: 12px;
    }

    .daftar-jebakan {
      display: grid;
      gap: 10px;
    }

    .item-jebakan {
      background-color: var(--bg-kanvas);
      border: 1px solid var(--garis-halus);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .item-jebakan-judul {
      font-weight: 700;
      font-size: 0.94rem;
      color: var(--merah-salah);
      margin-bottom: 2px;
    }

    .item-jebakan-ket {
      font-size: 0.92rem;
      color: var(--teks-utama);
    }

    /* =========================================================================
       LAYAR 5 & 6: RINGKASAN & KLASEMEN
       ========================================================================= */
    .daftar-peringkat {
      display: grid;
      gap: 12px;
      margin: 18px 0 22px;
    }

    .baris-peringkat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 20px;
      border-radius: 14px;
      background-color: #FFFFFF;
      border: 1.5px solid var(--garis-halus);
      transition: opacity 380ms ease, transform 380ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .baris-peringkat.tersembunyi {
      opacity: 0;
      transform: translateY(14px);
    }

    .baris-peringkat.lolos-final {
      border-color: var(--teal-utama);
      background-color: var(--bg-krem);
    }

    .nomor-peringkat {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background-color: var(--teal-utama);
      color: #FFFFFF;
      font-family: var(--font-angka);
      font-size: 1.2rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .status-lolos-teks {
      font-family: var(--font-judul);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--hijau-benar);
    }

    .rumus-modal-final {
      font-size: 0.88rem;
      color: var(--teks-sekunder);
      font-weight: 500;
      margin-top: 2px;
    }

    /* =========================================================================
       LAYAR 8: PEMENANG (PODIUM RINGKAS + TABEL)
       ========================================================================= */
    .wadah-konfeti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 40;
    }

    .keping-konfeti {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      animation: jatuhKonfeti linear infinite;
    }

    @keyframes jatuhKonfeti {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(540deg); opacity: 0.85; }
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: end;
      max-width: 880px;
      margin: 20px auto 24px;
    }

    .tiang-podium {
      background-color: #FFFFFF;
      border: 1.5px solid var(--garis-halus);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: var(--bayangan-kartu);
      animation: naikPodium 420ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tiang-podium.juara-1 {
      min-height: 245px;
      border: 2px solid var(--mustard);
      background-color: #FFFDF7;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tiang-podium.juara-2 {
      min-height: 205px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tiang-podium.juara-3 {
      min-height: 175px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @keyframes naikPodium {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tabel-ringkasan-poin {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.96rem;
    }

    .tabel-ringkasan-poin th,
    .tabel-ringkasan-poin td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--garis-halus);
      text-align: left;
    }

    .tabel-ringkasan-poin th {
      background-color: var(--bg-krem);
      color: var(--teal-gelap);
      font-weight: 700;
    }

    .tabel-ringkasan-poin td.angka,
    .tabel-ringkasan-poin th.angka {
      text-align: right;
      font-family: var(--font-angka);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       PANEL SAMPING MODE GURU & MODAL
       ========================================================================= */
    .latar-drawer {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 70, 77, 0.4);
      z-index: 60;
      display: flex;
      justify-content: flex-end;
    }

    .panel-guru {
      width: min(420px, 95vw);
      height: 100%;
      background-color: #FFFFFF;
      color: var(--teks-utama);
      padding: 20px;
      overflow-y: auto;
      box-shadow: -8px 0 28px rgba(0, 0, 0, 0.16);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bagian-guru {
      background-color: var(--bg-kanvas);
      border: 1px solid var(--garis-halus);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .bagian-guru h4 {
      margin: 0 0 8px;
      font-family: var(--font-judul);
      font-size: 0.96rem;
      color: var(--teal-utama);
    }

    .baris-koreksi-tim {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid var(--garis-halus);
    }

    .baris-koreksi-tim:last-child {
      border-bottom: none;
    }

    .grup-tombol-kecil {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tombol-kecil {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--garis-halus);
      background-color: #FFFFFF;
      color: var(--teks-utama);
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .tombol-kecil:hover:not(:disabled) {
      background-color: var(--bg-krem);
      border-color: var(--teal-utama);
    }

    .tombol-kecil:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tombol-kecil.bahaya {
      color: var(--merah-salah);
      border-color: #FECACA;
      background-color: #FEF2F2;
    }

    .latar-modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 70, 77, 0.48);
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .kotak-modal {
      width: min(680px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background-color: #FFFFFF;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
    }

    /* =========================================================================
       SKALA FONT & SOAL INTERAKTIF
       ========================================================================= */
    html.font-kecil { font-size: 14px; }
    html.font-sedang { font-size: 16px; }
    html.font-besar { font-size: 18.5px; }

    .kalimat-bernomor {
      display: inline;
    }
    .nomor-kalimat {
      font-family: var(--font-angka);
      font-size: 0.78em;
      font-weight: 700;
      color: var(--teal-utama);
      margin-right: 4px;
      user-select: none;
    }

    .kalimat-klik {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1.5px solid var(--garis-halus);
      background-color: var(--bg-kanvas);
      color: var(--teks-utama);
      font-size: clamp(1.02rem, 1.4vw, 1.25rem);
      line-height: 1.5;
      cursor: pointer;
      transition: border-color var(--transisi-cepat), background-color var(--transisi-cepat);
    }
    .kalimat-klik:hover:not(:disabled) {
      border-color: var(--teal-utama);
      background-color: var(--bg-krem);
    }
    .kalimat-klik.dipilih {
      border-color: var(--teal-utama);
      background-color: var(--bg-krem);
      box-shadow: 0 0 0 2px rgba(7, 116, 130, 0.25);
    }

    .kotak-kosong-terisi {
      display: inline;
      padding: 2px 8px;
      border-radius: 6px;
      background-color: var(--hijau-latar);
      border: 1.5px solid var(--hijau-benar);
      color: #14532D;
      font-weight: 700;
    }

    .opsi-centang-kotak {
      width: 58px;
      background-color: var(--mustard);
      color: var(--teks-utama);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .tombol-opsi.dipilih .opsi-centang-kotak {
      background-color: var(--teal-utama);
      color: #FFFFFF;
    }

    .daftar-pernyataan-bs {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .baris-bs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background-color: #FFFFFF;
      border: 1.5px solid var(--garis-halus);
      flex-wrap: wrap;
    }
    .teks-bs {
      flex: 1;
      min-width: 240px;
      font-size: clamp(0.98rem, 1.25vw, 1.15rem);
      font-weight: 600;
    }
    .grup-bs {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .tombol-bs {
      min-width: 94px;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--garis-halus);
      background-color: var(--bg-kanvas);
      font-weight: 700;
      font-size: 0.94rem;
      cursor: pointer;
    }
    .tombol-bs.aktif-benar {
      background-color: var(--hijau-benar);
      border-color: var(--hijau-benar);
      color: #FFFFFF;
    }
    .tombol-bs.aktif-salah {
      background-color: var(--merah-salah);
      border-color: var(--merah-salah);
      color: #FFFFFF;
    }

    /* Tangga Api Streak x1-x5 & Latar Dramatis Final */
    .tangga-api {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      margin-top: 4px;
    }
    .tingkat-api {
      width: 14px;
      border-radius: 3px;
      background-color: #E2E8F0;
    }
    .tingkat-api.lv-1 { height: 8px; }
    .tingkat-api.lv-2 { height: 11px; }
    .tingkat-api.lv-3 { height: 14px; }
    .tingkat-api.lv-4 { height: 17px; }
    .tingkat-api.lv-5 { height: 20px; }
    .tingkat-api.menyala {
      background-color: var(--mustard);
    }

    .wadah-aplikasi.dramatis-x4 {
      background-color: #064E56;
      color: #F8FAFC;
    }
    .wadah-aplikasi.dramatis-x5 {
      background-color: #00353B;
      color: #F8FAFC;
    }
    .wadah-aplikasi.dramatis-x4 .meta-soal-teks,
    .wadah-aplikasi.dramatis-x5 .meta-soal-teks,
    .wadah-aplikasi.dramatis-x4 .timer-angka,
    .wadah-aplikasi.dramatis-x5 .timer-angka {
      color: #FDE68A;
    }

    .banner-streak-acara {
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-family: var(--font-judul);
      font-size: clamp(1.05rem, 1.5vw, 1.35rem);
      font-weight: 700;
      text-align: center;
    }
    .banner-streak-acara.naik {
      background-color: var(--mustard);
      color: var(--teks-utama);
    }
    .banner-streak-acara.putus {
      background-color: #FEF2F2;
      color: var(--merah-salah);
      border: 1.5px solid #FECACA;
    }

    .kartu-poin-final-besar {
      background-color: var(--teal-utama);
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: var(--font-judul);
      font-size: 0.92rem;
      font-weight: 700;
      margin-top: 3px;
    }

    .tombol-rebutan-tim:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.6);
      transform: none;
    }

    /* =========================================================================
       INDIKATOR REBUTAN HP & MODAL QR
       ========================================================================= */
    .bilah-hp-r2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background-color: #FFFFFF;
      border: 1px solid var(--garis-halus);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
    }

    .grup-status-hp {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .lencana-hp-tim {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 8px;
      background-color: var(--bg-kanvas);
      border: 1px solid var(--garis-halus);
      font-size: 0.82rem;
    }

    .titik-hp {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #DC2626;
      flex-shrink: 0;
    }

    .titik-hp.nyala {
      background-color: #16A34A;
    }

    .banner-tercepat-hp {
      padding: 14px 20px;
      border-radius: 14px;
      color: #FFFFFF;
      text-align: center;
      font-family: var(--font-judul);
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 800;
      margin-bottom: 14px;
    }

    .grid-qr-modal {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .kartu-qr {
      background-color: var(--bg-kanvas);
      border: 1.5px solid var(--garis-halus);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .kartu-qr img {
      width: 144px;
      height: 144px;
      border-radius: 8px;
      background: #FFFFFF;
      padding: 6px;
      display: block;
      margin: 8px auto;
    }

    /* Layar Persiapan & Uji Coba Rebutan (Sebelum Ronde 2) */
    .grid-uji-coba {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 18px 0 22px;
    }

    .kartu-uji-coba {
      background-color: var(--bg-kanvas);
      border: 1.5px solid var(--garis-halus);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color var(--transisi-cepat), background-color var(--transisi-cepat);
    }

    .kartu-uji-coba.berhasil {
      border-color: var(--hijau-benar);
      background-color: var(--hijau-latar);
    }

    .lencana-status-uji {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      background-color: #E2E8F0;
      color: var(--teks-sekunder);
    }

    .lencana-status-uji.berhasil {
      background-color: var(--hijau-benar);
      color: #FFFFFF;
    }

    /* =========================================================================
       MODE LAYAR PENUH SAAT SOAL AKTIF (Tablet & PC Tanpa Scroll, Layar Lain Bebas Scroll)
       ========================================================================= */
    .tombol-opsi.opsi-salah-terkunci {
      background-color: #FEF2F2;
      border-color: #FECACA;
      color: #991B1B;
      opacity: 0.68;
      cursor: not-allowed;
    }
    .tombol-opsi.opsi-salah-terkunci .huruf-opsi {
      background-color: #DC2626;
      color: #FFFFFF;
    }
    .tombol-opsi.opsi-salah-terkunci .teks-opsi-isi {
      gap: 8px;
    }
    .tombol-opsi.opsi-salah-terkunci .teks-opsi-isi > span:first-child {
      text-decoration: line-through;
    }
    .badge-opsi-salah {
      margin-left: auto;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #FEE2E2;
      color: #B91C1C;
      font-size: 0.74rem;
      font-weight: 800;
      text-decoration: none !important;
      display: inline-block;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (min-width: 768px) and (min-height: 540px) {
      .wadah-aplikasi.mode-layar-soal {
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }
      .wadah-aplikasi.mode-layar-soal .bilah-atas {
        padding: 6px 20px;
        flex-shrink: 0;
      }
      .wadah-aplikasi.mode-layar-soal .merek-ikon {
        width: 30px;
        height: 30px;
      }
      .wadah-aplikasi.mode-layar-soal .tombol-utilitas {
        padding: 5px 11px;
        font-size: 0.82rem;
      }
      .wadah-aplikasi.mode-layar-soal .papan-skor {
        padding: 6px 20px;
        flex-shrink: 0;
      }
      .wadah-aplikasi.mode-layar-soal .kartu-skor-tim {
        padding: 6px 12px;
      }
      .wadah-aplikasi.mode-layar-soal .lencana-ikon-tim {
        width: 32px;
        height: 32px;

    function cekJawabanSoal(soal, jawabanData) {
      if (soal.tipe === 'multipilih') {
        const dipilih = [...(jawabanData.multi || [])].sort((a, b) => a - b);
        const kunci = [...(soal.kunciMulti || [])].sort((a, b) => a - b);
        return dipilih.length === kunci.length && dipilih.every((v, i) => v === kunci[i]);
      }
      if (soal.tipe === 'benar_salah') {
        const bs = jawabanData.bs || [];
        return (soal.pernyataanBS || []).every((item, idx) => bs[idx] === item.kunciBS);
      }
      return jawabanData.tunggal === soal.kunci;
    }

        },
        nilai(timIdx, jawabanData, soal) {
          const benar = cekJawabanSoal(soal, jawabanData);
          const tim = STATE.tim[timIdx];
          const poin = benar ? this.poinBenar : this.poinSalah;
          if (benar) {
            tim.stat.benar += 1;
            tim.stat.rebutanMenang += 1;
            if (tim.stat.baruSalah) {
              tim.stat.benarSetelahSalah += 1;
              tim.stat.baruSalah = false;
            }
          } else {
            tim.stat.salah += 1;
            tim.stat.baruSalah = true;
          }
          tim.skor = Math.max(0, tim.skor + poin);
          tim.skorRonde[2] += poin;
          return { benar, poin, infoStreak: null };
        },
        setelahPembahasan() {
          if (STATE.indeksSoal + 1 < STATE.soalAktifList[2].length) {
            STATE.indeksSoal += 1;
            STATE.giliranTim = null;
            STATE.rebutanTimDipilih = null;
            STATE.rebutanStatus = 'menunggu';
            STATE.timTerkunciR2 = [];
            STATE.opsiSalahR2 = [];

      },
      3: {

        ],
        mulai() {
          hitungFinalisDariPenyisihan();
          let daftarFinalis = STATE.tim.map((t, idx) => ({ t, idx })).filter((x) => x.t.finalis).map((x) => x.idx);
          if (daftarFinalis.length < 2) {

            hitungFinalisDariPenyisihan(true);
            daftarFinalis = STATE.tim.map((t, idx) => ({ t, idx })).filter((x) => x.t.finalis).map((x) => x.idx);

          STATE.giliranTim = daftarFinalis.length > 0 ? daftarFinalis[0] : 0;
          STATE.rebutanTimDipilih = null;
          STATE.transisiInfo = null;
          STATE.tim.forEach((t) => { t.streak = 0; });
        },
        renderInfoTipe(soal) {
          const petaTipe = {
            tentukan_ide_pokok: 'Ide Pokok',
            konjungsi_hubungan: 'Konjungsi & Hubungan',
            prediksi_simpulan: 'Prediksi & Simpulan',

          return `${tingkat}${petaTipe[soal.tipe] || 'Final'} · ${soal.LO}`;
        },
        nilai(timIdx, jawabanData, soal) {
          const benar = cekJawabanSoal(soal, jawabanData);
          const tim = STATE.tim[timIdx];
          let poin = 0;
          let infoStreak = null;

          if (benar) {
            tim.stat.benar += 1;
            if (tim.stat.baruSalah) {
              tim.stat.benarSetelahSalah += 1;
              tim.stat.baruSalah = false;
            }
            poin = hitungPoinStreakFinal(tim.streak);
            tim.streak = Math.min(5, (tim.streak || 0) + 1);
            if (tim.streak > tim.stat.streakTertinggi) tim.stat.streakTertinggi = tim.streak;
            tim.skor += poin;
            tim.skorRonde[3] += poin;
            if (tim.streak >= 2) {
              infoStreak = { jenis: 'naik', level: tim.streak, teks: `STREAK x${tim.streak}! ${tim.nama} (+${poin} poin)` };
            }
          } else {
            tim.stat.salah += 1;
            tim.stat.baruSalah = true;
            if (tim.streak >= 1) {
              infoStreak = { jenis: 'putus', teks: `STREAK PADAM! Api ${tim.nama} kembali ke 0.` };
            }
            tim.streak = 0;
          }
          return { benar, poin, infoStreak };
        },
        setelahPembahasan() {
          const daftarFinalis = STATE.tim
            .map((t, idx) => ({ t, idx }))
            .filter((item) => item.t.finalis)
            .map((item) => item.idx);
          const totalSoal = STATE.soalAktifList[3].length;
          const perFinalis = Math.max(1, Math.floor(totalSoal / Math.max(1, daftarFinalis.length)));
          const indeksBerikut = STATE.indeksSoal + 1;
          const timSelesaiIdx = STATE.giliranTim !== null ? STATE.giliranTim : (daftarFinalis[0] ?? 0);

          if (indeksBerikut % perFinalis === 0 || indeksBerikut >= totalSoal) {
            const slotBerikut = Math.floor(indeksBerikut / perFinalis);
            const selesaiRonde = indeksBerikut >= totalSoal || slotBerikut >= daftarFinalis.length;
            const timBerikutIdx = !selesaiRonde ? daftarFinalis[slotBerikut] : null;
            const timSelesai = STATE.tim[timSelesaiIdx];
            simpanRiwayat(`Selesai giliran ${timSelesai?.nama || 'Finalis'} di Babak Final`);

              totalPoinTim: timSelesai ? timSelesai.skor : 0,
              indeksBerikut,
              timBerikutIdx,
              selesaiRonde
            };
            SUARA.benar(3);
            masukLayar('transisiKelompok');
          } else {
            STATE.indeksSoal = indeksBerikut;
            siapkanSoalBaru();
          }
        }
      }

    /* =========================================================================
       5. UTILITAS SUARA WEB AUDIO API (Termasuk Nada Streak Level x1-x5 & Putus)
       ========================================================================= */
    let audioCtx = null;

    function mainkanNada(frekuensi, durasiDetik, tipe = 'sine', volume = 0.14, tunda = 0) {
      if (!STATE.pengaturan.suara) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const waktuMulai = audioCtx.currentTime + tunda;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = tipe;
        osc.frequency.setValueAtTime(frekuensi, waktuMulai);

        gain.gain.setValueAtTime(0.001, waktuMulai);
        gain.gain.exponentialRampToValueAtTime(volume, waktuMulai + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, waktuMulai + durasiDetik);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(waktuMulai);
        osc.stop(waktuMulai + durasiDetik + 0.02);
      } catch (e) {
        /* Abaikan jika browser membatasi audio sebelum interaksi */
      }
    }

      }

      if (['soal', 'final', 'tiebreaker', 'suddendeath'].includes(STATE.layar) && !STATE.terkunci) {
        if (STATE.layar === 'tiebreaker' || STATE.layar === 'suddendeath') {
          if (STATE.rebutanTimDipilih !== null) {
            mulaiTimer(STATE.pengaturan.timerRebutanDetik || 15);
          }
        } else if (STATE.rondeAktif === 1) {
          mulaiTimer(STATE.pengaturan.timerRonde1Detik || 45);
        } else if (STATE.rondeAktif === 3) {
          mulaiTimer(STATE.pengaturan.timerFinalDetik || 45);
        } else if (STATE.rondeAktif === 2 && STATE.rebutanStatus === 'menjawab') {
          mulaiTimer(STATE.pengaturan.timerRebutanDetik || 15);
        } else {
          hentikanTimer();
          STATE.timer.sisa = 0;
          STATE.timer.totalAktif = 0;
        }
      }
      SUARA.klik();
      render();
    }

    function kembaliLangkahSebelumnya() {
      if (STATE.riwayat.length > 0) {
        jalankanUndo();
        return;
      }
      mintaKonfirmasiKembaliKeMenu();
    }

    function mintaKonfirmasiKembaliKeMenu() {
      SUARA.klik();
      STATE.modalKonfirmasi = {
        judul: 'Kembali ke Menu Utama?',
        pesan: 'Kuis yang sedang berlangsung akan dihentikan dan Anda kembali ke layar awal (nama tim tetap tersimpan).',
        onYa: () => {
          resetStateTurnamen(true);
          render();
        }
      };
      render();
    }

    /* =========================================================================
       8. LOGIKA TIMER & ALUR SOAL / REBUTAN / TIEBREAKER / SUDDEN DEATH
       ========================================================================= */
    function hentikanTimer() {
      if (STATE.timer.intervalId) {
        clearInterval(STATE.timer.intervalId);
        STATE.timer.intervalId = null;
      }
      STATE.timer.berjalan = false;
    }

    function mulaiTimer(durasiKhusus = null) {
      hentikanTimer();
      const durasiDefault = STATE.rondeAktif === 1
        ? (STATE.pengaturan.timerRonde1Detik || 45)
        : (STATE.rondeAktif === 3
          ? (STATE.pengaturan.timerFinalDetik || 45)
          : (STATE.rondeAktif === 2 ? (STATE.pengaturan.timerRebutanDetik || 15) : 0));
      const detik = durasiKhusus !== null ? durasiKhusus : durasiDefault;
      if (detik <= 0) {
        STATE.timer.sisa = 0;
        STATE.timer.totalAktif = 0;
        return;
      }
      STATE.timer.totalAktif = detik;
      STATE.timer.sisa = detik;
      STATE.timer.berjalan = true;
      STATE.timer.intervalId = setInterval(() => {
        if (!['soal', 'final', 'tiebreaker', 'suddendeath'].includes(STATE.layar)) {
          hentikanTimer();
          return;
        }
        if (STATE.terkunci) {
          hentikanTimer();
          return;
        }
        STATE.timer.sisa -= 1;
        if (STATE.timer.sisa > 0 && STATE.timer.sisa <= 5) {
          SUARA.detik();
        }
        if (STATE.timer.sisa <= 0) {
          STATE.timer.sisa = 0;
          hentikanTimer();
          SUARA.waktuHabis();
          tanganiWaktuHabis();
          return;
        }
        perbaruiTampilanTimerSaja();
      }, 1000);
    }

    function perbaruiTampilanTimerSaja() {
      const angkaEl = document.getElementById('timer-angka-teks');
      const cincinEl = document.getElementById('timer-cincin-progres');
      const bungkusEl = document.getElementById('timer-lingkar-wadah');
      if (!angkaEl || !cincinEl || !bungkusEl) return;

      const total = STATE.timer.totalAktif || 1;
      const keliling = 2 * Math.PI * 30;
      const rasio = Math.max(0, STATE.timer.sisa / total);
      angkaEl.textContent = String(STATE.timer.sisa);
      cincinEl.style.strokeDashoffset = String(keliling * (1 - rasio));
      if (STATE.timer.sisa <= 5) {
        bungkusEl.classList.add('kritis');
      } else {
        bungkusEl.classList.remove('kritis');
      }
    }

    function tanganiWaktuHabis() {
      const soal = ambilSoalAktif();
      const timAktif = ambilTimAktif();

      if (STATE.layar === 'tiebreaker' && timAktif !== null && STATE.seriPeringkat2) {
        simpanRiwayat(`Tiebreaker waktu habis: ${STATE.tim[timAktif].nama}`);
        STATE.terkunci = true;
        const timSeri = STATE.seriPeringkat2;
        const pemenangIdx = timSeri.find((id) => id !== timAktif) ?? timSeri[0];
        STATE.tim[pemenangIdx].skor += 1;
        STATE.tim[pemenangIdx].skorRonde[2] += 1;
        STATE.sudahHitungFinalis = false;
        hitungFinalisDariPenyisihan(true);
        STATE.jawabanTerakhir = {
          timIdx: timAktif,
          pilihanData: null,
          benar: false,
          poin: 0,
          waktuHabis: true,
          dariTiebreaker: true,
          pemenangTiebreakIdx: pemenangIdx
        };
        STATE.layar = 'pembahasan';
        render();
        return;
      }

      if (STATE.layar === 'suddendeath' && timAktif !== null) {
        simpanRiwayat(`Sudden Death waktu habis: ${STATE.tim[timAktif].nama}`);
        STATE.terkunci = true;
        const finalis = STATE.tim.map((t, i) => ({ t, i })).filter((x) => x.t.finalis);
        const pemenangIdx = finalis.find((x) => x.i !== timAktif)?.i ?? timAktif;
        STATE.tim[pemenangIdx].skor += 10;
        STATE.tim[pemenangIdx].skorRonde[3] += 10;
        STATE.jawabanTerakhir = {
          timIdx: timAktif,
          pilihanData: null,
          benar: false,
          poin: 0,
          waktuHabis: true,
          dariSuddenDeath: true,
          pemenangSuddenDeathIdx: pemenangIdx
        };
        STATE.layar = 'pembahasan';
        render();
        return;
      }

      if (STATE.rondeAktif === 2 && timAktif !== null) {
        tanganiSalahAtauHabisRonde2(timAktif, null, true);
        return;
      }

      simpanRiwayat('Waktu habis');
      STATE.terkunci = true;
      const tim = timAktif !== null ? STATE.tim[timAktif] : null;
      let infoStreak = null;
      if (tim) {
        tim.stat.salah += 1;
        tim.stat.baruSalah = true;
        if (tim.streak >= 1) {
          infoStreak = {
            jenis: 'putus',
            teks: STATE.rondeAktif === 3
              ? `STREAK PADAM! Waktu habis, api ${tim.nama} kembali ke 0.`
              : `Streak ${tim.nama} terputus karena waktu habis!`
          };
          if (STATE.rondeAktif === 3) SUARA.streakPutus();
        }
        tim.streak = 0;
      }

      STATE.bannerStreakAcara = infoStreak;
      STATE.jawabanTerakhir = {
        timIdx: timAktif,
        pilihanData: null,
        benar: false,
        poin: 0,
        waktuHabis: true
      };
      STATE.layar = 'pembahasan';
      render();
    }

    function ambilSoalAktif() {
      if (STATE.layar === 'tiebreaker' || (STATE.layar === 'pembahasan' && STATE.jawabanTerakhir?.dariTiebreaker)) {
        return TIEBREAKER[STATE.tiebreakerIndex] || TIEBREAKER[0];
      }
      if (STATE.layar === 'suddendeath' || (STATE.layar === 'pembahasan' && STATE.jawabanTerakhir?.dariSuddenDeath)) {
        return SUDDEN_DEATH[STATE.suddenDeathIndex] || SUDDEN_DEATH[0];
      }
      const daftar = STATE.soalAktifList[STATE.rondeAktif] || [];
      return daftar[STATE.indeksSoal] || null;
    }

    function ambilTimAktif() {
      if (STATE.layar === 'tiebreaker' || STATE.layar === 'suddendeath') {
        return STATE.rebutanTimDipilih;
      }
      if (STATE.rondeAktif === 2) return STATE.rebutanTimDipilih;
      return STATE.giliranTim;
    }

    function siapkanSoalBaru() {
      STATE.pilihanSementara = null;
      STATE.pilihanMulti = [];
      STATE.pilihanBS = [];
      STATE.terkunci = false;
      STATE.jawabanTerakhir = null;
      STATE.kunciGuruTerlihat = false;
      STATE.bannerStreakAcara = null;
      STATE.transisiInfo = null;
      STATE.pesanRebutanUlang = '';
      STATE.hp.bannerTercepat = null;
      STATE.layar = STATE.rondeAktif === 3 ? 'final' : 'soal';

      if (STATE.rondeAktif === 2) {
        STATE.rebutanTimDipilih = null;
        STATE.giliranTim = null;
        STATE.rebutanStatus = 'menunggu';
        STATE.timTerkunciR2 = [];
        STATE.opsiSalahR2 = [];
        hentikanTimer();
        STATE.timer.sisa = STATE.pengaturan.timerRebutanDetik;
        STATE.timer.totalAktif = STATE.pengaturan.timerRebutanDetik;
        FIREBASE_HP?.tutupRebutan?.([], [], ambilSoalAktif());
      } else if (STATE.rondeAktif === 1) {
        mulaiTimer(STATE.pengaturan.timerRonde1Detik || 45);
      } else if (STATE.rondeAktif === 3) {
        mulaiTimer(STATE.pengaturan.timerFinalDetik || 45);
      } else {
        hentikanTimer();
        STATE.timer.sisa = 0;
        STATE.timer.totalAktif = 0;
      }
      render();
    }

    function masukLayar(namaLayar) {
      hentikanTimer();
      STATE.kunciGuruTerlihat = false;
      STATE.layar = namaLayar;

      if (namaLayar === 'klasemen') {
        hitungFinalisDariPenyisihan();
        mulaiAnimasiKlasemen();
      } else if (namaLayar === 'pemenang') {
        SUARA.menang();
      }
      render();
    }

    let timerAnimasiKlasemen = null;
    function mulaiAnimasiKlasemen() {
      if (timerAnimasiKlasemen) clearInterval(timerAnimasiKlasemen);
      STATE.klasemenTahap = STATE.tim.length; // Mulai sembunyikan, munculkan peringkat 4 -> 3 -> 2 -> 1
      let sisaLangkah = STATE.tim.length;
      timerAnimasiKlasemen = setInterval(() => {
        sisaLangkah -= 1;
        if (sisaLangkah > 0) {
          STATE.klasemenTahap = sisaLangkah;
        } else {
          STATE.klasemenTahap = 0;
          clearInterval(timerAnimasiKlasemen);
          timerAnimasiKlasemen = null;
        }
        if (STATE.layar === 'klasemen') render();
      }, 550);
    }

    function hitungFinalisDariPenyisihan(paksaTanpaSeri = false) {
      if (STATE.sudahHitungFinalis) return;

      const terurut = STATE.tim
        .map((t, idx) => ({ idx, skor: t.skor, skorR2: t.skorRonde[2] }))
        .sort((a, b) => b.skor - a.skor || b.skorR2 - a.skorR2 || a.idx - b.idx);

      /* Cek apakah perebutan peringkat ke-2 imbang (mendukung 4 kelompok) */
      if (!paksaTanpaSeri && terurut.length >= 3 && terurut[1].skor === terurut[2].skor) {
        const skorBatas = terurut[1].skor;
        const kandidatSeri = terurut.filter((item) => item.skor === skorBatas).map((item) => item.idx);
        STATE.seriPeringkat2 = kandidatSeri;
        terurut.forEach((item, pos) => {
          const tim = STATE.tim[item.idx];
          tim.peringkatPenyisihan = pos + 1;
          tim.skorPenyisihan = tim.skor;
          const lolosPasti = terurut[0].skor > skorBatas && pos === 0;
          tim.finalis = lolosPasti;
          tim.modalFinal = lolosPasti ? Math.round(tim.skor * 0.2) : 0;
        });
        return;
      }

      STATE.seriPeringkat2 = null;
      terurut.forEach((item, pos) => {
        const tim = STATE.tim[item.idx];
        tim.peringkatPenyisihan = pos + 1;
        tim.skorPenyisihan = tim.skor;
        if (pos < 2) {
          tim.finalis = true;
          tim.modalFinal = Math.round(tim.skorPenyisihan * 0.2);
          tim.skor = tim.modalFinal;
        } else {
          tim.finalis = false;
          tim.modalFinal = 0;
        }
      });
      STATE.sudahHitungFinalis = true;
    }

    /* =========================================================================
       9. AKSI INTERAKSI PENGGUNA, REBUTAN (HOOK HP TAHAP 3), TIEBREAKER & GURU
       ========================================================================= */
    function mulaiTurnamenDariSetup() {
      const nama = KONFIG_TIM_AWAL.map((cfg, idx) => {
        const inp = document.getElementById(`input-tim-${idx}`);
        return (inp?.value || '').trim() || cfg.namaDefault;
      });
      resetStateTurnamen(false);
      STATE.tim = buatTimAwal(nama);
      STATE.rondeAktif = 1;
      STATE.indeksSoal = 0;
      RONDE[1].mulai();
      FIREBASE_HP?.sinkronTim?.();
      SUARA.klik();
      masukLayar('judulRonde');
    }

    function mulaiRondeAktif() {
      simpanRiwayat(`Mulai Ronde ${STATE.rondeAktif}`);
      SUARA.klik();
      STATE.indeksSoal = 0;
      RONDE[STATE.rondeAktif].mulai();
      siapkanSoalBaru();
    }

    /* Tahap Khusus Sebelum Ronde 2: Persiapan & Uji Coba Tombol Rebutan HP */
    function masukPersiapanRonde2() {
      simpanRiwayat('Masuk Persiapan & Uji Coba Ronde 2');
      hentikanTimer();
      STATE.rondeAktif = 2;
      STATE.indeksSoal = 0;
      RONDE[2].mulai();
      STATE.hp.bannerTercepat = null;
      STATE.hp.ujiCoba = {
        aktif: false,
        hasil: { 1: false, 2: false, 3: false, 4: false }
      };
      FIREBASE_HP?.tutupRebutan?.([]);
      FIREBASE_HP?.sinkronTim?.();
      FIREBASE_HP?.aturUjiCoba?.(false, true);
      SUARA.klik();
      masukLayar('persiapanRonde2');
    }

    function mulaiUjiCobaRebutan() {
      if (!STATE.hp.terhubungServer) return;
      STATE.hp.bannerTercepat = null;
      STATE.hp.ujiCoba = {
        aktif: true,
        hasil: { 1: false, 2: false, 3: false, 4: false }
      };
      FIREBASE_HP.tutupRebutan([]);
      FIREBASE_HP.sinkronTim();
      FIREBASE_HP.aturUjiCoba(true, true);
      SUARA.bukaRebutan();
      render();
    }

    function ulangiUjiCobaRebutan() {
      if (!STATE.hp.terhubungServer) {
        STATE.hp.ujiCoba = {
          aktif: false,
          hasil: { 1: false, 2: false, 3: false, 4: false }
        };
        render();
        return;
      }
      STATE.hp.bannerTercepat = null;
      STATE.hp.ujiCoba = {
        aktif: true,
        hasil: { 1: false, 2: false, 3: false, 4: false }
      };
      FIREBASE_HP.tutupRebutan([]);
      FIREBASE_HP.sinkronTim();
      FIREBASE_HP.aturUjiCoba(true, true);
      SUARA.klik();
      render();
    }

    function lanjutDariPersiapanKeRonde2() {
      STATE.hp.ujiCoba.aktif = false;
      if (STATE.hp.terhubungServer) {
        FIREBASE_HP.aturUjiCoba(false, false);
        FIREBASE_HP.tutupRebutan([]);
      }
      lompatKeLayarRondeBerikutnya(2);
    }

    /* Ronde 2: Guru membuka rebutan setelah siswa membaca soal */
    function bukaRebutan() {
      if (STATE.rondeAktif !== 2 || STATE.terkunci) return;
      STATE.rebutanStatus = 'terbuka';
      STATE.pesanRebutanUlang = '';
      STATE.hp.bannerTercepat = null;
      if (STATE.hp.terhubungServer && STATE.hp.modeHP) {
        FIREBASE_HP.bukaRebutan(STATE.timTerkunciR2, false, STATE.opsiSalahR2, ambilSoalAktif());
      }
      SUARA.bukaRebutan();
      render();
    }

    /* Setelah jawaban salah di Mode HP: guru menekan "Buka Rebutan Lagi" */
    function bukaRebutanLagi() {
      bukaRebutan();
    }

    /* Guru membatalkan rebutan yang sedang terbuka/berlangsung */
    function batalkanRebutanR2() {
      if (STATE.rondeAktif !== 2 || STATE.terkunci) return;
      hentikanTimer();
      STATE.rebutanTimDipilih = null;
      STATE.giliranTim = null;
      STATE.rebutanStatus = 'menunggu';
      STATE.pilihanSementara = null;
      STATE.hp.bannerTercepat = null;
      FIREBASE_HP.tutupRebutan(STATE.timTerkunciR2, STATE.opsiSalahR2, ambilSoalAktif());
      SUARA.klik();
      render();
    }

    /* Uji coba rebutan HP tanpa poin sebelum Ronde 2 dimulai */
    function tesRebutanHP() {
      if (!STATE.hp.terhubungServer) return;
      STATE.hp.bannerTercepat = null;
      STATE.guruPanelBuka = false;
      FIREBASE_HP.sinkronTim();
      FIREBASE_HP.bukaRebutan([], true, [], null);
      SUARA.bukaRebutan();
      render();
    }

    function tutupTesRebutanHP() {
      STATE.hp.bannerTercepat = null;
      FIREBASE_HP.tutupRebutan(STATE.timTerkunciR2, STATE.opsiSalahR2, ambilSoalAktif());
      SUARA.klik();
      render();
    }

    function toggleModeHP() {
      if (!STATE.hp.terhubungServer) return;
      STATE.hp.modeHP = !STATE.hp.modeHP;
      if (STATE.hp.modeHP && STATE.rebutanStatus === 'terbuka') {
        FIREBASE_HP.bukaRebutan(STATE.timTerkunciR2, false, STATE.opsiSalahR2, ambilSoalAktif());
      } else if (!STATE.hp.modeHP) {
        FIREBASE_HP.tutupRebutan(STATE.timTerkunciR2, STATE.opsiSalahR2, ambilSoalAktif());
        if (STATE.rebutanStatus === 'menunggu_lagi') {
          STATE.rebutanStatus = 'terbuka';
        }
      }
      SUARA.klik();
      render();
    }

    function buatRuangBaruHP() {
      if (!STATE.hp.terhubungServer) return;
      SUARA.klik();
      FIREBASE_HP.buatRuangBaru(true);
    }

    function bukaModalQR() {
      STATE.hp.modalQRBuka = true;
      FIREBASE_HP.sinkronTim();
      SUARA.klik();
      render();
    }

    function tutupModalQR() {
      STATE.hp.modalQRBuka = false;
      SUARA.klik();
      render();
    }

    /* HOOK TUNGGAL RONDE 2 (Dipanggil tombol manual maupun transaksi Firebase tercepat) */
    function menetapkanPemenangRebutan(timIdx, dariHP = false) {
      if (STATE.terkunci) return;
      if (STATE.layar === 'tiebreaker' || STATE.layar === 'suddendeath') {
        pilihTimPenentuan(timIdx);
        return;
      }
      if (STATE.rondeAktif !== 2) return;
      if (STATE.timTerkunciR2.includes(timIdx)) return;

      simpanRiwayat(`Rebutan dimenangkan ${STATE.tim[timIdx].nama}`);
      STATE.rebutanTimDipilih = timIdx;
      STATE.giliranTim = timIdx;
      STATE.rebutanStatus = 'menjawab';
      STATE.pilihanSementara = null;
      STATE.pilihanMulti = [];
      STATE.pilihanBS = [];
      STATE.pesanRebutanUlang = '';
      if (!dariHP && STATE.hp.terhubungServer) {
        FIREBASE_HP.kunciPemenangManual(timIdx);
      }
      SUARA.kunci();
      mulaiTimer(STATE.pengaturan.timerRebutanDetik);
      render();
    }

    /* Alias agar pemanggilan lama atau tombol manual tetap konsisten */
    function pilihTimRebutan(timIdx) {
      menetapkanPemenangRebutan(timIdx, false);
    }

    function tanganiSalahAtauHabisRonde2(timIdx, jawabanData, waktuHabis) {
      const soal = ambilSoalAktif();
      simpanRiwayat(`R2 ${waktuHabis ? 'habis' : 'salah'}: ${STATE.tim[timIdx].nama}`);
      hentikanTimer();

      const hasil = RONDE[2].nilai(timIdx, jawabanData || { tunggal: null }, soal);
      if (!waktuHabis) SUARA.salah();

      STATE.skorBerdenyutTim = timIdx;
      setTimeout(() => { STATE.skorBerdenyutTim = null; }, 450);

      if (!STATE.timTerkunciR2.includes(timIdx)) {
        STATE.timTerkunciR2.push(timIdx);
      }

      if (!waktuHabis && jawabanData && typeof jawabanData.tunggal === 'number') {
        if (!STATE.opsiSalahR2.includes(jawabanData.tunggal)) {
          STATE.opsiSalahR2.push(jawabanData.tunggal);
        }
      }

      STATE.hp.bannerTercepat = null;
      FIREBASE_HP.tutupRebutan(STATE.timTerkunciR2, STATE.opsiSalahR2, soal);

      if (STATE.timTerkunciR2.length < STATE.tim.length) {
        STATE.rebutanTimDipilih = null;
        STATE.giliranTim = null;
        STATE.pilihanSementara = null;
        STATE.pilihanMulti = [];
        STATE.pilihanBS = [];
        STATE.terkunci = false;
        STATE.rebutanStatus = (STATE.hp.terhubungServer && STATE.hp.modeHP) ? 'menunggu_lagi' : 'terbuka';
        STATE.timer.sisa = STATE.pengaturan.timerRebutanDetik;
        const infoOpsiDihapus = (!waktuHabis && jawabanData && typeof jawabanData.tunggal === 'number')
          ? ` Pilihan ${HURUF_OPSI[jawabanData.tunggal]} dinonaktifkan.`
          : '';
        STATE.pesanRebutanUlang = `${waktuHabis ? 'Waktu habis' : 'Kurang tepat'} (${hasil.poin} poin)! ${STATE.tim[timIdx].nama} terkunci.${infoOpsiDihapus} ${STATE.hp.modeHP && STATE.hp.terhubungServer ? 'Tekan "Buka Rebutan Lagi" untuk kelompok tersisa!' : 'Rebutan ulang dibuka untuk kelompok lain!'}`;
        render();
        return;
      }

      /* Keempat kelompok sudah gagal: tampilkan pembahasan tanpa poin tambahan */
      STATE.terkunci = true;
      STATE.jawabanTerakhir = {
        timIdx,
        pilihanData: jawabanData,
        benar: false,
        poin: hasil.poin,
        waktuHabis,
        semuaGagal: true
      };
      STATE.layar = 'pembahasan';
      render();
    }

    function tutupRebutanTanpaPemenang() {
      if (STATE.rondeAktif !== 2 || STATE.terkunci) return;
      simpanRiwayat('Tidak ada tim yang merebut soal R2');
      hentikanTimer();
      STATE.hp.bannerTercepat = null;
      FIREBASE_HP.tutupRebutan([], [], null);
      STATE.terkunci = true;
      STATE.jawabanTerakhir = {
        timIdx: null,
        pilihanData: null,
        benar: false,
        poin: 0,
        waktuHabis: false,
        tidakAdaRebutan: true
      };
      STATE.layar = 'pembahasan';
      render();
    }

    function pilihOpsiJawaban(opsiIdx) {
      if (STATE.terkunci) return;
      if (STATE.rondeAktif === 2 && STATE.rebutanTimDipilih === null) return;
      if (STATE.rondeAktif === 2 && STATE.opsiSalahR2.includes(opsiIdx)) return;
      if ((STATE.layar === 'tiebreaker' || STATE.layar === 'suddendeath') && STATE.rebutanTimDipilih === null) return;
      STATE.pilihanSementara = opsiIdx;
      if (STATE.rondeAktif === 2 && STATE.rebutanStatus === 'menjawab') {
        FIREBASE_HP?.sinkronPilihanR2?.(opsiIdx);
      }
      SUARA.klik();
      render();
    }

    function toggleMultiPilih(opsiIdx) {
      if (STATE.terkunci) return;
      const ada = STATE.pilihanMulti.indexOf(opsiIdx);
      if (ada >= 0) STATE.pilihanMulti.splice(ada, 1);
      else STATE.pilihanMulti.push(opsiIdx);
      SUARA.klik();
      render();
    }

    function pilihBS(idxPernyataan, nilaiBool) {
      if (STATE.terkunci) return;
      STATE.pilihanBS[idxPernyataan] = nilaiBool;
      SUARA.klik();
      render();
    }

    function jawabanSudahSiapDikunci(soal) {
      if (!soal) return false;
      if (soal.tipe === 'multipilih') return STATE.pilihanMulti.length > 0;
      if (soal.tipe === 'benar_salah') {
        const total = (soal.pernyataanBS || []).length;
        return total > 0 && Array.from({ length: total }, (_, i) => STATE.pilihanBS[i]).every((v) => typeof v === 'boolean');
      }
      return STATE.pilihanSementara !== null;
    }

    function ambilPaketJawabanAktif(soal) {
      if (soal.tipe === 'multipilih') return { multi: [...STATE.pilihanMulti] };
      if (soal.tipe === 'benar_salah') return { bs: [...STATE.pilihanBS] };
      return { tunggal: STATE.pilihanSementara };
    }

    function kunciJawabanSekarang() {
      const soal = ambilSoalAktif();
      if (STATE.terkunci || !soal || !jawabanSudahSiapDikunci(soal)) return;

      if (STATE.layar === 'tiebreaker') {
        kunciJawabanTiebreaker();
        return;
      }
      if (STATE.layar === 'suddendeath') {
        kunciJawabanSuddenDeath();
        return;
      }

      const timAktif = ambilTimAktif();
      if (timAktif === null) return;

      const paketJawaban = ambilPaketJawabanAktif(soal);

      /* Khusus Ronde 2: jika salah, kurangi -5, kunci tim, buka rebutan ulang jika masih ada tim lain */
      if (STATE.rondeAktif === 2) {
        const benarR2 = cekJawabanSoal(soal, paketJawaban);
        if (!benarR2) {
          tanganiSalahAtauHabisRonde2(timAktif, paketJawaban, false);
          return;
        }
      }

      simpanRiwayat(`Kunci jawaban ${STATE.tim[timAktif].nama} pada ${soal.id}`);
      hentikanTimer();
      STATE.terkunci = true;
      if (STATE.rondeAktif === 2) {
        STATE.hp.bannerTercepat = null;
        FIREBASE_HP.tutupRebutan([]);
      }

      const hasil = RONDE[STATE.rondeAktif].nilai(timAktif, paketJawaban, soal);
      STATE.bannerStreakAcara = hasil.infoStreak || null;
      STATE.jawabanTerakhir = {
        timIdx: timAktif,
        pilihanData: paketJawaban,
        benar: hasil.benar,
        poin: hasil.poin,
        waktuHabis: false
      };

      if (hasil.benar) {
        SUARA.benar(STATE.rondeAktif === 3 ? STATE.tim[timAktif].streak : 1);
      } else {
        if (STATE.rondeAktif === 3 && hasil.infoStreak?.jenis === 'putus') {
          SUARA.streakPutus();
        } else {
          SUARA.salah();
        }
      }

      if (hasil.poin !== 0) {
        STATE.skorBerdenyutTim = timAktif;
        setTimeout(() => { STATE.skorBerdenyutTim = null; }, 450);
      }

      STATE.layar = 'pembahasan';
      render();
    }

    function lanjutDariPembahasan() {
      SUARA.klik();
      STATE.bannerStreakAcara = null;
      if (STATE.jawabanTerakhir?.dariTiebreaker) {
        masukLayar('klasemen');
        return;
      }
      if (STATE.jawabanTerakhir?.dariSuddenDeath) {
        masukLayar('pemenang');
        return;
      }
      RONDE[STATE.rondeAktif].setelahPembahasan();
    }

    /* Tiebreaker (Seri Peringkat 2) & Sudden Death (Seri Akhir Final) */
    function pilihTimPenentuan(timIdx) {
      if (STATE.terkunci) return;
      STATE.rebutanTimDipilih = timIdx;
      STATE.giliranTim = timIdx;
      STATE.pilihanSementara = null;
      SUARA.kunci();
      mulaiTimer(STATE.pengaturan.timerRebutanDetik);
      render();
    }

    function mulaiTiebreaker() {
      if (!STATE.seriPeringkat2) return;
      simpanRiwayat('Mulai babak Tiebreaker');
      hentikanTimer();
      STATE.layar = 'tiebreaker';
      STATE.rebutanTimDipilih = null;
      STATE.giliranTim = null;
      STATE.pilihanSementara = null;
      STATE.terkunci = false;
      SUARA.bukaRebutan();
      render();
    }

    function kunciJawabanTiebreaker() {
      const soal = ambilSoalAktif();
      const timIdx = STATE.rebutanTimDipilih;
      if (timIdx === null || !STATE.seriPeringkat2) return;

      simpanRiwayat(`Kunci Tiebreaker oleh ${STATE.tim[timIdx].nama}`);
      hentikanTimer();
      STATE.terkunci = true;

      const paket = ambilPaketJawabanAktif(soal);
      const benar = cekJawabanSoal(soal, paket);
      const timSeri = STATE.seriPeringkat2;
      const timLainIdx = timSeri.find((id) => id !== timIdx) ?? timSeri[0];
      const pemenangIdx = benar ? timIdx : timLainIdx;

      /* Terapkan hasil tiebreaker ke peringkat penyisihan & finalis */
      STATE.tim[pemenangIdx].skor += 1;
      STATE.tim[pemenangIdx].skorRonde[2] += 1;
      STATE.sudahHitungFinalis = false;
      hitungFinalisDariPenyisihan(true);

      if (benar) SUARA.benar(2);
      else SUARA.salah();

      STATE.jawabanTerakhir = {
        timIdx,
        pilihanData: paket,
        benar,
        poin: benar ? 1 : 0,
        waktuHabis: false,
        dariTiebreaker: true,
        pemenangTiebreakIdx: pemenangIdx
      };
      STATE.layar = 'pembahasan';
      render();
    }

    function cekHasilAkhirFinal() {
      const finalis = STATE.tim.filter((t) => t.finalis);
      if (finalis.length === 2 && finalis[0].skor === finalis[1].skor) {
        mulaiSuddenDeath();
        return;
      }
      masukLayar('pemenang');
    }

    function mulaiSuddenDeath() {
      simpanRiwayat('Mulai babak Sudden Death');
      hentikanTimer();
      STATE.layar = 'suddendeath';
      STATE.rebutanTimDipilih = null;
      STATE.giliranTim = null;
      STATE.pilihanSementara = null;
      STATE.terkunci = false;
      SUARA.bukaRebutan();
      render();
    }

    function kunciJawabanSuddenDeath() {
      const soal = ambilSoalAktif();
      const timIdx = STATE.rebutanTimDipilih;
      if (timIdx === null) return;

      simpanRiwayat(`Kunci Sudden Death oleh ${STATE.tim[timIdx].nama}`);
      hentikanTimer();
      STATE.terkunci = true;

      const paket = ambilPaketJawabanAktif(soal);
      const benar = cekJawabanSoal(soal, paket);
      const finalis = STATE.tim.map((t, i) => ({ t, i })).filter((x) => x.t.finalis);
      const lawanIdx = finalis.find((x) => x.i !== timIdx)?.i ?? timIdx;
      const pemenangIdx = benar ? timIdx : lawanIdx;

      STATE.tim[pemenangIdx].skor += 10;
      STATE.tim[pemenangIdx].skorRonde[3] += 10;

      if (benar) SUARA.menang();
      else SUARA.salah();

      STATE.jawabanTerakhir = {
        timIdx,
        pilihanData: paket,
        benar,
        poin: benar ? 10 : 0,
        waktuHabis: false,
        dariSuddenDeath: true,
        pemenangSuddenDeathIdx: pemenangIdx
      };
      STATE.layar = 'pembahasan';
      render();
    }

    function lewatiSoalGuru() {
      simpanRiwayat('Guru melewati soal');
      hentikanTimer();
      if (STATE.layar === 'tiebreaker') { masukLayar('klasemen'); return; }
      if (STATE.layar === 'suddendeath') { masukLayar('pemenang'); return; }
      RONDE[STATE.rondeAktif].setelahPembahasan();
    }

    function gantiSoalCadanganGuru() {
      if (STATE.layar === 'tiebreaker') {
        if (STATE.tiebreakerIndex + 1 < TIEBREAKER.length) {
          simpanRiwayat('Ganti soal Tiebreaker ke cadangan');
          STATE.tiebreakerIndex += 1;
          mulaiTiebreaker();
        }
        return;
      }
      if (STATE.layar === 'suddendeath') {
        if (STATE.suddenDeathIndex + 1 < SUDDEN_DEATH.length) {
          simpanRiwayat('Ganti soal Sudden Death ke cadangan');
          STATE.suddenDeathIndex += 1;
          mulaiSuddenDeath();
        }
        return;
      }

      const r = STATE.rondeAktif;
      const pool = CADANGAN[r] || [];
      const idx = STATE.cadanganIndex[r] || 0;
      if (idx >= pool.length) return;

      simpanRiwayat(`Ganti soal R${r} dengan cadangan`);
      STATE.soalAktifList[r][STATE.indeksSoal] = klonSoal([pool[idx]])[0];
      STATE.cadanganIndex[r] = idx + 1;
      siapkanSoalBaru();
    }

    function rebutanManualGuru() {
      simpanRiwayat('Buka ulang panel rebutan manual');
      hentikanTimer();
      STATE.rondeAktif = 2;
      STATE.rebutanTimDipilih = null;
      STATE.giliranTim = null;
      STATE.rebutanStatus = 'terbuka';
      STATE.timTerkunciR2 = [];
      STATE.opsiSalahR2 = [];
      STATE.pilihanSementara = null;
      STATE.pilihanMulti = [];
      STATE.pilihanBS = [];
      STATE.terkunci = false;
      STATE.guruPanelBuka = false;
      STATE.hp.modeHP = false;
      STATE.hp.bannerTercepat = null;
      FIREBASE_HP?.tutupRebutan?.([], [], ambilSoalAktif());
      STATE.layar = 'soal';
      render();
    }

    function lompatKeLayarGuru(tujuan) {
      simpanRiwayat(`Lompat ke ${tujuan}`);
      hentikanTimer();
      STATE.guruPanelBuka = false;
      STATE.transisiInfo = null;
      if (tujuan !== 'persiapanRonde2' && typeof FIREBASE_HP !== 'undefined') {
        STATE.hp.ujiCoba.aktif = false;
        FIREBASE_HP?.aturUjiCoba?.(false, false);
        FIREBASE_HP?.tutupRebutan?.([]);
      }

      if (tujuan === 'setup') {
        STATE.modalKonfirmasi = {
          judul: TEKS.konfirmasiResetJudul,
          pesan: TEKS.konfirmasiResetPesan,
          onYa: () => {
            resetStateTurnamen(true);
            render();
          }
        };
        render();
        return;
      }

      if (tujuan === 'persiapanRonde2') {
        masukPersiapanRonde2();
        return;
      }

      if (tujuan === 'r1' || tujuan === 'r2' || tujuan === 'r3') {
        const nomor = Number(tujuan[1]);
        if (nomor < 3) {
          STATE.sudahHitungFinalis = false;
          STATE.seriPeringkat2 = null;
          STATE.tim.forEach((t) => { t.finalis = true; });
        } else if (!STATE.sudahHitungFinalis) {
          hitungFinalisDariPenyisihan(true);
        }
        STATE.rondeAktif = nomor;
        STATE.indeksSoal = 0;
        RONDE[nomor].mulai();
        masukLayar('judulRonde');
        return;
      }

      if (tujuan === 'final') {
        if (!STATE.sudahHitungFinalis) {
          hitungFinalisDariPenyisihan(true);
        }
        STATE.rondeAktif = 3;
        STATE.indeksSoal = 0;
        RONDE[3].mulai();
        siapkanSoalBaru();
        return;
      }

      if (tujuan === 'tiebreaker') {
        const terurut = STATE.tim.map((t, i) => ({ t, i })).sort((a, b) => b.t.skor - a.t.skor);
        STATE.seriPeringkat2 = [terurut[1].i, terurut[2].i];
        mulaiTiebreaker();
        return;
      }

      if (tujuan === 'suddendeath') {
        hitungFinalisDariPenyisihan(true);
        mulaiSuddenDeath();
        return;
      }

      masukLayar(tujuan);
    }

      setTimeout(render, 120);
