                    <span class="streak-label">Streak ${isiR1}/3</span>
                    ${[0, 1, 2].map((s) => `<span class="streak-batang ${s < isiR1 ? 'isi' : ''}"></span>`).join('')}
                  </div>
                `;
              }

              return `
                <div class="kartu-skor-tim ${sedangGiliran ? 'sedang-giliran' : ''} ${adalahPenonton ? 'penonton' : ''}">
                  <div class="info-tim-kiri">

                </div>

            : '<span class="kotak-kosong-berkedip" aria-label="Kotak kosong yang harus dilengkapi">???</span>';

        const relevan = sorotRelevan && Array.isArray(soal.kalimatRelevan) && soal.kalimatRelevan.includes(idx);

          ? (STATE.timer.totalAktif || STATE.pengaturan.timerFinalDetik || 45)
          : (STATE.timer.totalAktif || STATE.pengaturan.timerRebutanDetik || 15));

      if (total <= 0) {
        return '';
      }
      const sisaTampil = STATE.rondeAktif === 2 && STATE.layar === 'soal' && STATE.rebutanStatus !== 'menjawab'
        ? STATE.pengaturan.timerRebutanDetik
        : STATE.timer.sisa;
      const keliling = 2 * Math.PI * 30;
      const rasio = Math.max(0, sisaTampil / (total || 1));
      const offset = keliling * (1 - rasio);
      const kritis = sisaTampil <= 5 && sisaTampil > 0 && STATE.timer.berjalan;

      return `
        <div id="timer-lingkar-wadah" class="timer-lingkar ${kritis ? 'kritis' : ''}" aria-label="Sisa waktu ${sisaTampil} detik">
          <svg viewBox="0 0 76 76">
            <circle cx="38" cy="38" r="30" fill="none" stroke="#DCECEF" stroke-width="7"></circle>
            <circle
              id="timer-cincin-progres"
              cx="38"
              cy="38"
              r="30"
              fill="none"
              stroke="${kritis ? '#B91C1C' : '#FA9E2D'}"
              stroke-width="7"
              stroke-linecap="round"
              stroke-dasharray="${keliling}"
              stroke-dashoffset="${offset}"
            ></circle>
          </svg>
          <span id="timer-angka-teks" class="timer-angka">${sisaTampil}</span>
        </div>
      `;
    }

    function renderAreaPilihanSoal(soal, bisaKlikOpsi) {
      if (soal.tipe === 'detektif_kalimat') {
        const terpilih = STATE.pilihanSementara;
        return `
          <div style="background: #FFFFFF; border: 1.5px solid var(--garis-halus); border-radius: 12px; padding: 12px 18px; margin-bottom: 16px; font-weight: 600;">
            ${terpilih !== null
              ? `Kalimat terpilih: <strong style="color: var(--teal-utama);">Kalimat (${terpilih + 1})</strong>`
              : 'Ketuk salah satu kalimat bernomor langsung di dalam kotak bacaan di atas.'}
          </div>
        `;
      }

      if (soal.tipe === 'multipilih') {
        return `
          <div class="grid-opsi" role="group" aria-label="Pilihan Multi-Pilih">
            ${soal.opsi.map((op, idx) => {
              const dipilih = STATE.pilihanMulti.includes(idx);
              return `
                <button
                  type="button"
                  class="tombol-opsi ${dipilih ? 'dipilih' : ''}"
                  ${bisaKlikOpsi ? '' : 'disabled'}
                  onclick="toggleMultiPilih(${idx})"
                >
                  <span class="opsi-centang-kotak">${dipilih ? '✓' : HURUF_OPSI[idx]}</span>
                  <span class="teks-opsi-isi">${escapeHtml(op.teks)}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      if (soal.tipe === 'benar_salah') {
        return `
          <div class="daftar-pernyataan-bs" role="group" aria-label="Pernyataan Benar atau Salah">
            ${(soal.pernyataanBS || []).map((item, idx) => {
              const val = STATE.pilihanBS[idx];
              return `
                <div class="baris-bs">
                  <div class="teks-bs">${idx + 1}. ${escapeHtml(item.teks)}</div>
                  <div class="grup-bs">
                    <button
                      type="button"
                      class="tombol-bs ${val === true ? 'aktif-benar' : ''}"
                      ${bisaKlikOpsi ? '' : 'disabled'}
                      onclick="pilihBS(${idx}, true)"
                    >Benar</button>
                    <button
                      type="button"
                      class="tombol-bs ${val === false ? 'aktif-salah' : ''}"
                      ${bisaKlikOpsi ? '' : 'disabled'}
                      onclick="pilihBS(${idx}, false)"
                    >Salah</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="grid-opsi" role="radiogroup" aria-label="Pilihan Jawaban">
          ${soal.opsi.map((op, idx) => {
            const sudahSalahR2 = STATE.rondeAktif === 2 && STATE.opsiSalahR2.includes(idx);
            const dipilih = !sudahSalahR2 && STATE.pilihanSementara === idx;
            const nonaktif = !bisaKlikOpsi || sudahSalahR2;
            return `
              <button
                type="button"
                class="tombol-opsi ${dipilih ? 'dipilih' : ''} ${sudahSalahR2 ? 'opsi-salah-terkunci' : ''}"
                ${nonaktif ? 'disabled' : ''}
                onclick="pilihOpsiJawaban(${idx})"
              >
                <span class="huruf-opsi">${sudahSalahR2 ? '✗' : HURUF_OPSI[idx]}</span>
                <span class="teks-opsi-isi">
                  <span>${escapeHtml(op.teks)}</span>
                  ${sudahSalahR2 ? '<span class="badge-opsi-salah">Sudah Salah</span>' : ''}
                </span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderSoal() {
      const modeTiebreak = STATE.layar === 'tiebreaker';
      const modeSudden = STATE.layar === 'suddendeath';
      const soal = ambilSoalAktif();
      const cfg = RONDE[STATE.rondeAktif];
      const daftarSoal = STATE.soalAktifList[STATE.rondeAktif] || [];
      if (!soal) return renderRingkasan();

      const timAktif = ambilTimAktif();
      const timObj = timAktif !== null ? STATE.tim[timAktif] : null;
      const butuhAksiRebutanR2 = STATE.rondeAktif === 2 && !modeTiebreak && !modeSudden && timObj === null;
      const butuhPilihPenentuan = (modeTiebreak || modeSudden) && timObj === null;
      const modeBerurutan = !modeTiebreak && !modeSudden && (STATE.rondeAktif === 1 || STATE.rondeAktif === 3);
      const jumlahPerTim = STATE.rondeAktif === 1
        ? Math.max(1, Math.floor(daftarSoal.length / STATE.tim.length))
        : Math.max(1, Math.floor(daftarSoal.length / Math.max(1, STATE.tim.filter((t) => t.finalis).length)));
      const soalDalamGiliran = modeBerurutan ? ((STATE.indeksSoal % jumlahPerTim) + 1) : null;

      let bannerHtml = '';
      if (timObj) {
        bannerHtml = `
          <div class="banner-giliran" style="border-color: ${timObj.warna}; background-color: ${timObj.warnaLatar};">
            <span class="lencana-ikon-tim" style="background-color: ${timObj.warna}; color: ${timObj.teksDiIsi || '#FFFFFF'}; width: 38px; height: 38px;">
              ${ikonBentukTim(timObj.bentuk, 18)}
            </span>
            <span>Giliran: <strong style="color: ${timObj.warnaTeks || timObj.warna};">${escapeHtml(timObj.nama)}</strong>${soalDalamGiliran ? ` · <strong>${soalDalamGiliran}/${jumlahPerTim} soal</strong>` : ''}, silakan maju!</span>
          </div>
        `;
      } else if (modeTiebreak) {
        bannerHtml = `
          <div class="banner-giliran" style="border-color: var(--mustard); background-color: var(--mustard-lembut);">
            <span>TIEBREAKER PERINGKAT 2 · Pilih tim yang paling cepat merebut</span>
          </div>
        `;
      } else if (modeSudden) {
        bannerHtml = `
          <div class="banner-giliran" style="border-color: var(--mustard); background-color: var(--mustard-lembut);">
            <span>SUDDEN DEATH FINAL · Duel penentu juara turnamen</span>
          </div>
        `;
      } else {
        bannerHtml = `
          <div class="banner-giliran" style="border-color: var(--mustard); background-color: var(--mustard-lembut);">
            <span>Babak Rebutan · ${STATE.rebutanStatus === 'menunggu' ? 'Baca soal dulu, lalu guru menekan Buka Rebutan' : 'Pilih tim tercepat!'}</span>
          </div>
        `;
      }

      let panelRebutanHtml = '';
      if (butuhAksiRebutanR2) {
        if (STATE.rebutanStatus === 'menunggu') {
          panelRebutanHtml = `
            <div class="panel-rebutan" style="text-align: center;">
              <h3>Soal Ronde 2 Sudah Tampil</h3>
              <p>Beri waktu siswa membaca teks sejenak, lalu tekan tombol di bawah untuk membuka adu cepat${STATE.hp.terhubungServer && STATE.hp.modeHP ? ' di semua HP kelompok' : ''}.</p>
              <button type="button" class="tombol-primer" style="min-width: 260px;" onclick="bukaRebutan()">
                ${TEKS.tombolBukaRebutan}
              </button>
            </div>
          `;
        } else if (STATE.rebutanStatus === 'menunggu_lagi') {
          panelRebutanHtml = `
            <div class="panel-rebutan">
              <h3>Rebutan Ulang Siap Dibuka</h3>
              <p>${escapeHtml(STATE.pesanRebutanUlang)}</p>
              <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
                <button type="button" class="tombol-primer" style="min-width: 260px;" onclick="bukaRebutanLagi()">
                  Buka Rebutan Lagi
                </button>
                <button type="button" class="tombol-sekunder" onclick="tutupRebutanTanpaPemenang()">
                  Tidak Ada yang Merebut
                </button>
              </div>
              <div class="grid-tombol-rebutan">
                ${STATE.tim.map((t, idx) => {
                  const terkunciTim = STATE.timTerkunciR2.includes(idx);
                  return `
                    <button
                      type="button"
                      class="tombol-rebutan-tim"
                      style="background-color: ${t.warna}; color: ${t.teksDiIsi || '#FFFFFF'};"
                      ${terkunciTim ? 'disabled' : ''}
                      onclick="menetapkanPemenangRebutan(${idx})"
                    >
                      ${ikonBentukTim(t.bentuk, 24)}
                      <span>${escapeHtml(t.nama)}${terkunciTim ? ' (Terkunci)' : ' (Manual)'}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        } else {
          const modeHpAktif = STATE.hp.terhubungServer && STATE.hp.modeHP;
          panelRebutanHtml = `
            <div class="panel-rebutan">
              <h3>${modeHpAktif ? 'REBUTAN HP DIBUKA! Tekan tombol REBUT di HP!' : TEKS.panelRebutanJudul}</h3>
              <p>${STATE.pesanRebutanUlang ? escapeHtml(STATE.pesanRebutanUlang) : (modeHpAktif ? 'Tim yang paling cepat menekan HP langsung tampil otomatis. Tombol di bawah tetap tersedia sebagai cadangan manual.' : TEKS.panelRebutanSub)}</p>
              <div class="grid-tombol-rebutan">
                ${STATE.tim.map((t, idx) => {
                  const terkunciTim = STATE.timTerkunciR2.includes(idx);
                  return `
                    <button
                      type="button"
                      class="tombol-rebutan-tim"
                      style="background-color: ${t.warna}; color: ${t.teksDiIsi || '#FFFFFF'};"
                      ${terkunciTim ? 'disabled' : ''}
                      onclick="menetapkanPemenangRebutan(${idx})"
                    >
                      ${ikonBentukTim(t.bentuk, 24)}
                      <span>${escapeHtml(t.nama)}${terkunciTim ? ' (Terkunci)' : ''}</span>
                    </button>
                  `;
                }).join('')}
              </div>
              <div style="margin-top: 12px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="tombol-kecil" onclick="batalkanRebutanR2()">
                  Batalkan Rebutan
                </button>
                <button type="button" class="tombol-kecil" onclick="tutupRebutanTanpaPemenang()">
                  Tidak Ada yang Merebut (Tampilkan Jawaban)
                </button>
              </div>
            </div>
          `;
        }
      } else if (butuhPilihPenentuan) {
        const kandidatIdx = modeTiebreak
          ? (STATE.seriPeringkat2 || [1, 2])
          : STATE.tim.map((t, i) => ({ t, i })).filter((x) => x.t.finalis).map((x) => x.i);
        panelRebutanHtml = `
          <div class="panel-rebutan">
            <h3>${modeTiebreak ? 'Tiebreaker: Siapa yang tercepat?' : 'Sudden Death: Siapa yang tercepat?'}</h3>
            <p>Guru memilih tim tercepat dari kedua tim yang bertanding untuk menjawab soal penentuan ini.</p>
            <div class="grid-tombol-rebutan" style="grid-template-columns: repeat(${Math.min(4, Math.max(2, kandidatIdx.length))}, 1fr);">
              ${kandidatIdx.map((idx) => {
                const t = STATE.tim[idx];
                return `
                  <button
                    type="button"
                    class="tombol-rebutan-tim"
                    style="background-color: ${t.warna}; color: ${t.teksDiIsi || '#FFFFFF'};"
                    onclick="pilihTimPenentuan(${idx})"
                  >
                    ${ikonBentukTim(t.bentuk, 24)}
                    <span>${escapeHtml(t.nama)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      const bisaKlikOpsi = !butuhAksiRebutanR2 && !butuhPilihPenentuan && !STATE.terkunci;
      const siapKunci = bisaKlikOpsi && jawabanSudahSiapDikunci(soal);

      const labelMeta = modeTiebreak
        ? 'TIEBREAKER PENYISIHAN'
        : (modeSudden
          ? 'SUDDEN DEATH FINAL'
          : (soalDalamGiliran
            ? `Ronde ${cfg.nomor} · Progres ${escapeHtml(timObj?.nama || '')}: ${soalDalamGiliran}/${jumlahPerTim} soal (Total ${STATE.indeksSoal + 1}/${daftarSoal.length})`
            : `Ronde ${cfg.nomor} · Soal ${STATE.indeksSoal + 1} dari ${daftarSoal.length}`));

      const poinFinalHtml = (STATE.rondeAktif === 3 && !modeTiebreak && !modeSudden && timObj)
        ? `<div class="kartu-poin-final-besar">Jika benar: +${hitungPoinStreakFinal(timObj.streak)} poin</div>`
        : '';

      const bannerAcaraHtml = STATE.bannerStreakAcara
        ? `<div class="banner-streak-acara ${STATE.bannerStreakAcara.jenis}">${escapeHtml(STATE.bannerStreakAcara.teks)}</div>`
        : '';

      const barStatusHpR2Html = (STATE.rondeAktif === 2 && !modeTiebreak && !modeSudden) ? renderBarStatusHP() : '';

      const kelasLayarPenuh = `layar-masuk layar-soal-penuh ${soal.tipe === 'detektif_kalimat' ? 'soal-lebar-penuh' : ''}`;

      return `
        <div class="${kelasLayarPenuh}">
          ${barStatusHpR2Html}
          ${bannerAcaraHtml}
          <div class="baris-status-soal">
            ${bannerHtml}
            <div class="info-soal-kanan">
              ${(STATE.rondeAktif === 2 && timObj && !STATE.terkunci) ? `
                <button type="button" class="tombol-kecil" onclick="batalkanRebutanR2()">Batalkan Rebutan</button>
              ` : ''}
              <div class="meta-soal-teks">
                <div>${labelMeta}</div>
                ${poinFinalHtml}
              </div>
              ${renderTimerMelingkar()}
            </div>
          </div>

          <div class="badan-soal-split">
            <article class="kartu-teks-bacaan">
              <div class="label-lo-tipe">${modeTiebreak || modeSudden ? escapeHtml(soal.LO) : cfg.renderInfoTipe(soal)}</div>
              <div class="paragraf-soal">${renderParagrafSoal(soal, false)}</div>
              <h2 class="pertanyaan-inti">${escapeHtml(soal.pertanyaan)}</h2>
            </article>

            <div class="kolom-jawaban-soal${panelRebutanHtml ? ' ada-panel-rebutan' : ''}">
              ${panelRebutanHtml}
              ${renderAreaPilihanSoal(soal, bisaKlikOpsi)}
            </div>
          </div>

          <div class="zona-kunci-jawaban">
            <div class="petunjuk-kunci">
              ${(butuhAksiRebutanR2 || butuhPilihPenentuan)
                ? 'Selesaikan pemilihan tim tercepat terlebih dahulu sebelum mengunci jawaban.'
                : (!siapKunci ? TEKS.petunjukPilihDulu : TEKS.petunjukSiapKunci)}
            </div>
            <button
              type="button"
              class="tombol-primer tombol-kunci-besar"
              ${siapKunci ? '' : 'disabled'}
              onclick="kunciJawabanSekarang()"
            >
              ${TEKS.tombolKunciJawaban}
            </button>
          </div>
        </div>
      `;
    }

    function renderFinal() {
      return renderSoal();
    }

    function renderTiebreaker() {
      return renderSoal();
    }

    function renderSuddenDeath() {
      return renderSoal();
    }

    function formatRingkasanPilihanSiswa(soal, info) {
      if (info.tidakAdaRebutan) return 'Tidak ada tim yang menekan bel rebutan pada soal ini.';
      if (!info.pilihanData) return 'Tidak ada jawaban yang dikunci sebelum waktu berakhir.';
      if (soal.tipe === 'multipilih') {
        const list = (info.pilihanData.multi || []).map((i) => `${HURUF_OPSI[i]}`);
        return `Pilihan dikunci: <strong>${list.length ? list.join(', ') : 'Kosong'}</strong>`;
      }
      if (soal.tipe === 'benar_salah') {
        const list = (info.pilihanData.bs || []).map((b, idx) => `${idx + 1}: ${b ? 'Benar' : 'Salah'}`);
        return `Pilihan dikunci: <strong>${list.join(' · ')}</strong>`;
      }
      const idx = info.pilihanData.tunggal;
      if (idx === null || idx === undefined || !soal.opsi[idx]) return 'Tidak ada jawaban yang dikunci.';
      return `Pilihan dikunci: <strong>${HURUF_OPSI[idx]}. ${escapeHtml(soal.opsi[idx].teks)}</strong>`;
    }

    function renderPembahasan() {
      const soal = ambilSoalAktif();
      const info = STATE.jawabanTerakhir || { timIdx: 0, pilihanData: null, benar: false, poin: 0, waktuHabis: false };
      const timObj = info.timIdx !== null && info.timIdx !== undefined ? STATE.tim[info.timIdx] : null;
      const daftarSoal = STATE.soalAktifList[STATE.rondeAktif] || [];
      const adalahSoalTerakhir = STATE.indeksSoal + 1 >= daftarSoal.length;

      let judulStatus = 'Kurang Tepat';
      if (info.tidakAdaRebutan) judulStatus = 'Tidak Ada Tim yang Merebut';
      else if (info.semuaGagal) judulStatus = 'Semua Tim Gagal Menjawab';
      else if (info.waktuHabis) judulStatus = 'Waktu Habis!';
      else if (info.benar) judulStatus = `Tepat Sekali, ${timObj ? escapeHtml(timObj.nama) : 'Tim'}!`;
      else if (timObj) judulStatus = `Belum Tepat, ${escapeHtml(timObj.nama)}`;

      const teksPoin = info.poin > 0 ? `+${info.poin} poin` : (info.poin < 0 ? `${info.poin} poin` : '0 poin');

      let kunciHtml = '';
      let jebakanHtml = '';
      if (soal.tipe === 'benar_salah') {
        kunciHtml = `
          <div class="kotak-kunci-benar">
            ${(soal.pernyataanBS || []).map((p, idx) => `
              <div>${idx + 1}. <strong>${p.kunciBS ? 'BENAR' : 'SALAH'}</strong> — ${escapeHtml(p.teks)}</div>
            `).join('')}
          </div>
        `;
        jebakanHtml = `
          <div class="item-jebakan">
            <div class="item-jebakan-judul">Analisis Per Pernyataan</div>
            <div class="item-jebakan-ket">${escapeHtml(soal.pembahasan)}</div>
          </div>
        `;
      } else if (soal.tipe === 'multipilih') {
        const kunciSet = soal.kunciMulti || [];
        kunciHtml = `
          <div class="kotak-kunci-benar">
            Kunci Tepat: ${kunciSet.map((i) => `${HURUF_OPSI[i]}. ${escapeHtml(soal.opsi[i].teks)}`).join(' | ')}
          </div>
        `;
        jebakanHtml = soal.opsi.map((op, idx) => `
          <div class="item-jebakan">
            <div class="item-jebakan-judul">Opsi ${HURUF_OPSI[idx]} · ${escapeHtml(op.kategori)}</div>
            <div class="item-jebakan-ket">${escapeHtml(op.jebakan)}</div>
          </div>
        `).join('');
      } else {
        const kunciOpsi = soal.opsi[soal.kunci];
        const daftarSalah = soal.opsi.map((op, idx) => ({ op, idx })).filter((item) => item.idx !== soal.kunci);
        kunciHtml = `
          <div class="kotak-kunci-benar">
            Kunci ${HURUF_OPSI[soal.kunci]}: ${escapeHtml(kunciOpsi.teks)}
          </div>
        `;
        jebakanHtml = daftarSalah.map((item) => `
          <div class="item-jebakan">
            <div class="item-jebakan-judul">Opsi ${HURUF_OPSI[item.idx]} · ${escapeHtml(item.op.kategori)}</div>
            <div class="item-jebakan-ket">${escapeHtml(item.op.jebakan)}</div>
          </div>
        `).join('');
      }

      let labelTombolLanjut = adalahSoalTerakhir ? TEKS.tombolLihatRingkasan : TEKS.tombolSoalBerikutnya;
      if ((STATE.rondeAktif === 1 || STATE.rondeAktif === 3) && !info.dariTiebreaker && !info.dariSuddenDeath) {
        const jmlKelompokRonde = STATE.rondeAktif === 1
          ? STATE.tim.length
          : Math.max(1, STATE.tim.filter((t) => t.finalis).length);
        const perGiliran = Math.max(1, Math.floor(daftarSoal.length / jmlKelompokRonde));
        if ((STATE.indeksSoal + 1) % perGiliran === 0 || adalahSoalTerakhir) {
          labelTombolLanjut = `Selesai Giliran ${timObj ? timObj.nama : 'Kelompok'}`;
        }
      }
      if (info.dariTiebreaker) labelTombolLanjut = 'Lihat Klasemen Finalis';
      if (info.dariSuddenDeath) labelTombolLanjut = 'Lihat Podium Juara';

      const bannerAcaraHtml = STATE.bannerStreakAcara
        ? `<div class="banner-streak-acara ${STATE.bannerStreakAcara.jenis}">${escapeHtml(STATE.bannerStreakAcara.teks)}</div>`
        : '';

      let catatanPenentuanHtml = '';
      if (info.dariTiebreaker && typeof info.pemenangTiebreakIdx === 'number') {
        catatanPenentuanHtml = `<p style="margin:8px 0 0; font-weight:700; color:var(--hijau-benar);">Pemenang Tiebreaker: ${escapeHtml(STATE.tim[info.pemenangTiebreakIdx].nama)} lolos ke Final!</p>`;
      }
      if (info.dariSuddenDeath && typeof info.pemenangSuddenDeathIdx === 'number') {
        catatanPenentuanHtml = `<p style="margin:8px 0 0; font-weight:700; color:var(--hijau-benar);">Juara Turnamen (Sudden Death): ${escapeHtml(STATE.tim[info.pemenangSuddenDeathIdx].nama)}!</p>`;
      }

      return `
        <div class="layar-masuk">
          ${bannerAcaraHtml}
          <div class="banner-hasil-jawaban ${info.benar ? 'benar' : 'salah'}">
            <div>
              <h2 class="judul-hasil-jawaban">${judulStatus}</h2>
              <div>${formatRingkasanPilihanSiswa(soal, info)}</div>
              ${catatanPenentuanHtml}
            </div>
            <div class="poin-perubahan">${teksPoin}</div>
          </div>

          <div class="grid-pembahasan">
            <div class="kartu-kunci-alasan">
              <h3 class="judul-bagian">Bukti Teks &amp; Kunci Jawaban</h3>
              <div class="paragraf-soal" style="font-size: 1.12rem;">${renderParagrafSoal(soal, true)}</div>
              ${kunciHtml}
              <p style="margin: 0; font-size: 1.05rem;">

    function hitungLencanaDetektif() {
      const timList = STATE.tim;
      const pilihTerbaik = (skorFn) => {
        let bestIdx = 0;
        let bestVal = -Infinity;
        timList.forEach((t, idx) => {
          const v = skorFn(t, idx);
          if (v > bestVal) {
            bestVal = v;
            bestIdx = idx;
          }
        });
        return bestIdx;
      };

      const idxTeliti = pilihTerbaik((t) => {
        const tot = t.stat.benar + t.stat.salah;
        return tot > 0 ? (t.stat.benar / tot) * 1000 + t.stat.benar : t.skor;
      });
      const idxStreak = pilihTerbaik((t) => t.stat.streakTertinggi * 100 + t.stat.benar);
      const idxRebutan = pilihTerbaik((t) => t.stat.rebutanMenang * 100 + t.skorRonde[2]);

      /* Lencana ke-4 diprioritaskan bagi tim yang belum menerima lencana agar minimal 1 lencana per tim */
      const sudahPunya = new Set([idxTeliti, idxStreak, idxRebutan]);
      const idxBelum = timList.findIndex((_, idx) => !sudahPunya.has(idx));
      const idxBangkit = idxBelum >= 0
        ? idxBelum
        : pilihTerbaik((t) => t.stat.benarSetelahSalah * 100 + t.skorPenyisihan);

      return [
        {
          judul: 'Detektif Paling Teliti',
          tim: timList[idxTeliti],
          alasan: `${timList[idxTeliti].stat.benar} jawaban benar dengan akurasi tertinggi sepanjang turnamen.`
        },
        {
          judul: 'Penguasa Streak Beruntun',
          tim: timList[idxStreak],
          alasan: `Mencetak streak beruntun terbaik hingga ${timList[idxStreak].stat.streakTertinggi} kali berturut-turut.`
        },
        {
          judul: 'Kilat Babak Rebutan',
          tim: timList[idxRebutan],
          alasan: `Memenangkan ${timList[idxRebutan].stat.rebutanMenang} kali duel kecepatan pada Ronde 2.`
        },
        {
          judul: 'Detektif Pantang Menyerah',
          tim: timList[idxBangkit],
          alasan: `Tetap fokus menyumbang analisis positif hingga akhir babak penyisihan dan final.`
        }
      ];
    }

    function unduhRingkasanTurnamen() {
      const terurut = [...STATE.tim].sort((a, b) => {
        if (a.finalis !== b.finalis) return a.finalis ? -1 : 1;
        return b.skor - a.skor || b.skorPenyisihan - a.skorPenyisihan;
      });
      const lencana = hitungLencanaDetektif();

      const baris = [
        'RINGKASAN TURNAMEN: DETEKTIF INFERENSIAL CUP',
        'Materi: TKA Bahasa Indonesia SMP Kelas 9 (Pemahaman Inferensial)',
        '==============================================================',
        '',
        'HASIL AKHIR PER TIM:',
        ...terurut.map((t, pos) => (
          `#${pos + 1} ${t.nama} | R1: ${t.skorRonde[1]} | R2: ${t.skorRonde[2]} | Modal Final: ${t.finalis ? t.modalFinal : '-'} | R3: ${t.finalis ? t.skorRonde[3] : 'Penonton'} | Akhir: ${t.skor}`
        )),
        '',
        'LENCANA DETEKTIF:',
        ...lencana.map((l) => `- ${l.judul}: ${l.tim.nama} (${l.alasan})`),
        '',
        'STATISTIK TIM:',
        ...STATE.tim.map((t) => `- ${t.nama}: Benar ${t.stat.benar}, Salah ${t.stat.salah}, Streak Maks ${t.stat.streakTertinggi}, Menang Rebutan ${t.stat.rebutanMenang}`)
      ];

      const blob = new Blob([baris.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ringkasan-detektif-inferensial-cup.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      SUARA.klik();
    }

    function buatUrlHPTim(timNomor) {
      let basis = (STATE.hp.baseUrlQR || '').trim();
      if (!basis) basis = deteksiBaseUrlQR() || window.location.href;
      if (!/^[a-z]+:\/\//i.test(basis) && !basis.startsWith('file:')) {
        basis = 'https://' + basis;
      }
      let base;
      try {
        const u = new URL(basis);
        if (/rebut\.html$/i.test(u.pathname)) {
          base = u;
        } else if (/\.html?$/i.test(u.pathname)) {
          base = new URL('rebut.html', u.href);
        } else {
          const dir = u.pathname.endsWith('/') ? (u.origin + u.pathname) : (u.origin + u.pathname + '/');
          base = new URL('rebut.html', dir);
        }
      } catch (e) {
        base = new URL('rebut.html', window.location.href);
      }
      base.search = '';
      if (STATE.hp.kodeRuang) base.searchParams.set('ruang', STATE.hp.kodeRuang);
      if (timNomor >= 1 && timNomor <= 4) base.searchParams.set('tim', String(timNomor));
      return base.href;
    }

        return `

              ${escapeHtml(t?.nama || `Kelompok ${nomor}`)}

            <div style="font-size:0.75rem; color:var(--teks-sekunder); word-break:break-all;">${escapeHtml(urlTim)}</div>
          </div>
        `;
      }).join('');
    }

    function salinFallback(teks) {
      try {
        const ta = document.createElement('textarea');
        ta.value = teks;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
    }

    function salinUrlUmumQR() {
      const urlUmum = buatUrlHPTim(0);
      const tandaiTersalin = () => {
        const btn = document.getElementById('tombol-salin-url-qr');
        if (btn) {
          btn.textContent = 'Tersalin!';
          setTimeout(() => {
            const b = document.getElementById('tombol-salin-url-qr');
            if (b) b.textContent = 'Salin Tautan Umum';
          }, 1800);
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(urlUmum).then(tandaiTersalin).catch(() => {
          salinFallback(urlUmum);
          tandaiTersalin();
        });
      } else {
        salinFallback(urlUmum);
        tandaiTersalin();
      }
    }

    function buatDataUrlQR(teks) {
      if (typeof window.qrcode !== 'function') return '';
      try {
        const qr = window.qrcode(0, 'M');
        qr.addData(teks);
        qr.make();
        return qr.createDataURL(6, 2);
      } catch (e) {
        return '';
      }
    }

              <div style="display:flex; align-items:center; gap:14px;">
                <span class="lencana-ikon-tim" style="background-color:${timSelesai.warna}; color:${timSelesai.teksDiIsi || '#FFFFFF'}; width:48px; height:48px;">
                  ${ikonBentukTim(timSelesai.bentuk, 24)}
                </span>
                <div>
                  <h2 class="judul-hasil-jawaban" style="margin-bottom:4px;">
                    ${escapeHtml(timSelesai.nama)} Telah Selesai!
                  </h2>
                  <div style="font-size:1rem; font-weight:600;">
                    Menyelesaikan <strong>${info.jumlahSoalSelesai} soal</strong> penuh di ${judulRonde}
                  </div>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:0.84rem; font-weight:700; opacity:0.85;">Poin ${judulRonde}</div>
                <div class="poin-perubahan" style="font-size:1.75rem;">+${info.poinRondeDiperoleh} poin</div>
                <div style="font-size:0.86rem; font-weight:700;">Total Skor: ${info.totalPoinTim} poin</div>
              </div>
            </div>
          </div>

          ${!info.selesaiRonde && timBerikut ? `
            <div class="banner-giliran" style="justify-content:center; border-color:${timBerikut.warna}; background-color:${timBerikut.warnaLatar}; padding:18px 22px; margin-bottom:24px;">
              <span class="lencana-ikon-tim" style="background-color:${timBerikut.warna}; color:${timBerikut.teksDiIsi || '#FFFFFF'}; width:40px; height:40px;">
                ${ikonBentukTim(timBerikut.bentuk, 20)}
              </span>
              <div style="text-align:left;">
                <div style="font-size:0.88rem; font-weight:700; color:var(--teks-sekunder);">Notifikasi Giliran Berikutnya</div>
                <div style="font-size:1.12rem;">
                  <strong style="color:${timBerikut.warnaTeks || timBerikut.warna};">${escapeHtml(timBerikut.nama)}</strong> akan memulai permainan (${info.jumlahSoalSelesai} soal · 45 detik/soal).
                </div>
              </div>
            </div>

            <button type="button" class="tombol-primer" style="min-width: 280px;" onclick="lanjutDariTransisiKelompok()">
              <span>Lanjut ke ${escapeHtml(timBerikut.nama)}</span>
            </button>
          ` : `
            <div class="banner-streak-acara naik" style="margin-bottom: 24px; padding: 16px 20px;">
              ${info.ronde === 3
                ? 'Babak Final (Ronde 3) telah berakhir! Semua kelompok finalis telah menyelesaikan seluruh soal.'
                : 'Ronde 1 telah berakhir! Seluruh kelompok (A, B, C, dan D) telah menyelesaikan giliran.'}
            </div>

            <button type="button" class="tombol-primer" style="min-width: 280px;" onclick="lanjutDariTransisiKelompok()">
              <span>${info.ronde === 3 ? 'Lihat Ringkasan &amp; Hasil Akhir' : 'Lihat Ringkasan Ronde 1'}</span>
            </button>
          `}
        </div>
      `;
    }

    function renderLayarAktif() {
      switch (STATE.layar) {
        case 'setup': return renderSetup();
        case 'judulRonde': return renderJudulRonde();
        case 'persiapanRonde2': return renderPersiapanRonde2();
        case 'soal': return renderSoal();
        case 'pembahasan': return renderPembahasan();
        case 'transisiKelompok': return renderTransisiKelompok();
        case 'ringkasan': return renderRingkasan();
        case 'klasemen': return renderKlasemen();
        case 'tiebreaker': return renderTiebreaker();
        case 'final': return renderFinal();
        case 'suddendeath': return renderSuddenDeath();
        case 'pemenang': return renderPemenang();
        default: return renderSetup();
      }
    }

    function renderBannerTercepatHP() {
      const b = STATE.hp.bannerTercepat;
      if (b) {
        return `
          <div class="banner-tercepat-hp" style="background-color: ${b.warna}; color: ${b.teksDiIsi || '#FFFFFF'};">
            ${b.modeTes
              ? `TES REBUTAN: ${escapeHtml(b.nama).toUpperCase()} TERCEPAT! (Tanpa Poin)`
              : `${escapeHtml(b.nama).toUpperCase()} TERCEPAT! Silakan maju!`}
            ${b.modeTes ? `
              <div style="margin-top: 10px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                <button type="button" class="tombol-kecil" onclick="tesRebutanHP()">Buka Tes Lagi</button>
                <button type="button" class="tombol-kecil" onclick="tutupTesRebutanHP()">Tutup Tes</button>
              </div>
            ` : ''}
          </div>
        `;
      }
      if (STATE.hp.modeTes && STATE.hp.statusServer === 'buka') {
        return `
          <div class="banner-tercepat-hp" style="background-color: var(--biru-tua); border: 3px solid var(--mustard);">
            TES REBUTAN HP DIBUKA — Silakan setiap kelompok menekan tombol REBUT! di HP
            <div style="margin-top: 10px; display:flex; justify-content:center; gap:10px;">
              <button type="button" class="tombol-kecil" onclick="tutupTesRebutanHP()">Tutup Tes</button>
            </div>
          </div>
        `;
      }
      return '';
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      const layarSoalAktif = ['soal', 'final', 'tiebreaker', 'suddendeath'].includes(STATE.layar);
      root.classList.toggle('mode-layar-soal', layarSoalAktif);

      /* Terapkan latar dramatis di Babak Final ketika finalis aktif memasuki Streak x4 atau x5 */
      root.classList.remove('dramatis-x4', 'dramatis-x5');
      if (STATE.layar === 'final') {
        const timAktif = ambilTimAktif();
        const streakTim = timAktif !== null ? (STATE.tim[timAktif]?.streak || 0) : 0;
        if (streakTim >= 4) root.classList.add('dramatis-x5');
        else if (streakTim === 3) root.classList.add('dramatis-x4');
      }

      root.innerHTML = `
        ${renderBilahAtas()}
        ${renderPapanSkor()}
        <main class="area-utama">
          ${renderBannerTercepatHP()}
          ${renderLayarAktif()}
        </main>
        <footer class="bilah-bawah-aksen">
          <span>Detektif Inferensial Cup</span>
          <span>Bahasa Indonesia SMP Kelas 9</span>
        </footer>
        ${renderPanelGuru()}
        ${renderModalQR()}
        ${renderModalAturan()}
        ${renderModalKonfirmasi()}
      `;
    }

    /* =========================================================================
       14. JEMBATAN FIREBASE CLOUD FIRESTORE UNTUK REBUTAN HP (TAHAP 3)
       ========================================================================= */
    const OperationType = {
      CREATE: 'create',
      UPDATE: 'update',
      DELETE: 'delete',
      LIST: 'list',
      GET: 'get',
      WRITE: 'write'
    };

    function handleFirestoreError(error, operationType, path) {
      const errInfo = {
        error: error instanceof Error ? error.message : String(error),
        authInfo: {
          userId: null,
          email: null,
          emailVerified: null,
          isAnonymous: null,
          tenantId: null,
          providerInfo: []
        },
        operationType,
        path
      };
      console.error('Firestore Error: ', JSON.stringify(errInfo));
      throw new Error(JSON.stringify(errInfo));
    }

    const FIREBASE_HP = {
      db: null,
      sdk: null,
      lepasRuang: null,
      timerPresence: null,
      terinisialisasi: false,
      lastSeenHP: { 1: 0, 2: 0, 3: 0, 4: 0 },
      terakhirTerlihatGuru: { 1: 0, 2: 0, 3: 0, 4: 0 },

      apakahConfigTerisi() {
        return Boolean(
          typeof firebaseConfig === 'object'
          && firebaseConfig.apiKey
          && firebaseConfig.projectId
          && firebaseConfig.firestoreDatabaseId
          && !String(firebaseConfig.apiKey).includes('ISI_')
        );
      },

      async testConnection() {
        if (!this.db || !this.sdk) return false;
        const { doc, getDocFromServer } = this.sdk;
        try {
          await getDocFromServer(doc(this.db, 'test', 'connection'));
          return true;
        } catch (error) {
          if (error instanceof Error && error.message.includes('the client is offline')) {
            console.error('Please check your Firebase configuration.');
            return false;
          }
          return navigator.onLine;
        }
      },

      async inisialisasi() {
        if (this.terinisialisasi) return;
        this.terinisialisasi = true;
        if (!this.apakahConfigTerisi()) {
          STATE.hp.terhubungServer = false;
          STATE.hp.modeHP = false;
          return;
        }
        try {
          const [appSdk, fsSdk] = await Promise.all([
            import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
            import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
          ]);
          this.sdk = fsSdk;
          const app = appSdk.initializeApp(firebaseConfig);
          if (typeof fsSdk.initializeFirestore === 'function') {
            try {
              this.db = fsSdk.initializeFirestore(
                app,
                { experimentalAutoDetectLongPolling: true },
                firebaseConfig.firestoreDatabaseId
              );
            } catch (initErr) {
              this.db = fsSdk.getFirestore(app, firebaseConfig.firestoreDatabaseId);
            }
          } else {
            this.db = fsSdk.getFirestore(app, firebaseConfig.firestoreDatabaseId);
          }

          this.testConnection().then((ok) => {
            if (!ok && navigator.onLine) {
              console.warn('Uji koneksi awal Firestore lambat/gagal, tetap melanjutkan.');
            }
          });

          STATE.hp.terhubungServer = navigator.onLine !== false;

          if (STATE.hp.terhubungServer) {
            if (!STATE.hp.kodeRuang) {
              await this.buatRuangBaru(false);
            }
            if (STATE.hp.terhubungServer && !STATE.hp.modeHP) STATE.hp.modeHP = true;
          }

          window.addEventListener('online', async () => {
            STATE.hp.terhubungServer = true;
            if (!STATE.hp.kodeRuang || !this.lepasRuang) await this.buatRuangBaru(false);
            render();
          });
          window.addEventListener('offline', () => {
            STATE.hp.terhubungServer = false;
            render();
          });

          if (!this.timerPresence) {
            this.timerPresence = setInterval(() => {
              if (!STATE.hp.terhubungServer) return;
              const sekarang = Date.now();
              let berubah = false;
              [1, 2, 3, 4].forEach((tid) => {
                const aktifSekarang = this.terakhirTerlihatGuru[tid] > 0 && (sekarang - this.terakhirTerlihatGuru[tid] < 40000);
                if (STATE.hp.hpTim[tid] !== aktifSekarang) {
                  STATE.hp.hpTim[tid] = aktifSekarang;
                  berubah = true;
                }
              });
              if (berubah && (STATE.rondeAktif === 2 || STATE.layar === 'persiapanRonde2' || STATE.guruPanelBuka)) {
                render();
              }
            }, 10000);
          }

          render();
        } catch (err) {
          STATE.hp.terhubungServer = false;
          STATE.hp.modeHP = false;
          render();
        }
      },

      buatKode4Digit() {
        return String(Math.floor(1000 + Math.random() * 9000));
      },

      objekTerkunci(timTerkunciArr = []) {
        return {
          '1': timTerkunciArr.includes(0),
          '2': timTerkunciArr.includes(1),
          '3': timTerkunciArr.includes(2),
          '4': timTerkunciArr.includes(3)
        };
      },

      objekOpsiSalah(opsiArr = []) {
        return {
          '0': opsiArr.includes(0),
          '1': opsiArr.includes(1),
          '2': opsiArr.includes(2),
          '3': opsiArr.includes(3)
        };
      },

      objekOpsiTeks(soal = null) {
        const daftar = (soal && Array.isArray(soal.opsi)) ? soal.opsi : [];
        return {
          '0': String(daftar[0]?.teks || '').slice(0, 300),
          '1': String(daftar[1]?.teks || '').slice(0, 300),
          '2': String(daftar[2]?.teks || '').slice(0, 300),
          '3': String(daftar[3]?.teks || '').slice(0, 300)
        };
      },

      namaTimAman() {
        return {
          '1': (STATE.tim[0]?.nama || 'Kelompok A').trim().slice(0, 40) || 'Kelompok A',
          '2': (STATE.tim[1]?.nama || 'Kelompok B').trim().slice(0, 40) || 'Kelompok B',
          '3': (STATE.tim[2]?.nama || 'Kelompok C').trim().slice(0, 40) || 'Kelompok C',
          '4': (STATE.tim[3]?.nama || 'Kelompok D').trim().slice(0, 40) || 'Kelompok D'
        };
      },

      warnaTimAman() {
        return {
          '1': (STATE.tim[0]?.warna || '#D93829').slice(0, 20),
          '2': (STATE.tim[1]?.warna || '#1D5FD6').slice(0, 20),
          '3': (STATE.tim[2]?.warna || '#15803D').slice(0, 20),
          '4': (STATE.tim[3]?.warna || '#EAB308').slice(0, 20)
        };
      },

      async buatRuangBaru(renderUlang = true) {
        if (!this.db || !this.sdk) return;
        const { doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } = this.sdk;
        const kodeLama = STATE.hp.kodeRuang;

        if (this.lepasRuang) {
          this.lepasRuang();
          this.lepasRuang = null;
        }

        if (kodeLama) {
          deleteDoc(doc(this.db, 'ruang', kodeLama)).catch(() => {});
        }

        const kodeBaru = this.buatKode4Digit();
        STATE.hp.kodeRuang = kodeBaru;
        STATE.hp.hpTim = { 1: false, 2: false, 3: false, 4: false };
        STATE.hp.ujiCoba = { aktif: false, hasil: { 1: false, 2: false, 3: false, 4: false } };
        STATE.hp.bannerTercepat = null;
        this.lastSeenHP = { 1: 0, 2: 0, 3: 0, 4: 0 };
        this.terakhirTerlihatGuru = { 1: 0, 2: 0, 3: 0, 4: 0 };

        const soalR2 = STATE.rondeAktif === 2 ? ambilSoalAktif() : null;
        const pathBaru = `ruang/${kodeBaru}`;
        try {
          await setDoc(doc(this.db, 'ruang', kodeBaru), {
            status: 'tutup',
            ronde: STATE.rondeAktif === 2 ? Math.min(30, Math.max(0, Number(STATE.indeksSoal) + 1)) : 0,
            modeTes: false,
            pemenang: null,
            waktuMenang: null,
            pilihanHp: null,
            terkunciTim: this.objekTerkunci(STATE.timTerkunciR2),
            opsiSalah: this.objekOpsiSalah(STATE.rondeAktif === 2 ? STATE.opsiSalahR2 : []),
            opsiTeks: this.objekOpsiTeks(soalR2),
            ujiCoba: {
              aktif: false,
              hasil: { '1': false, '2': false, '3': false, '4': false }
            },
            namaTim: this.namaTimAman(),
            warnaTim: this.warnaTimAman(),
            hp: {
              '1': { online: false, lastSeen: 0 },
              '2': { online: false, lastSeen: 0 },
              '3': { online: false, lastSeen: 0 },
              '4': { online: false, lastSeen: 0 }
            },
            dibuatPada: serverTimestamp()
          });
        } catch (error) {
          STATE.hp.terhubungServer = false;
          STATE.hp.kodeRuang = '';
          if (renderUlang) render();
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.CREATE, pathBaru);
          }
          return;
        }

        this.lepasRuang = onSnapshot(doc(this.db, 'ruang', kodeBaru), (snap) => {
          if (!snap.exists()) return;
          const data = snap.data();

          const hpObj = data.hp || {};
          const sekarang = Date.now();
          [1, 2, 3, 4].forEach((tid) => {
            const slot = hpObj[String(tid)];
            if (slot?.online) {
              const ls = Number(slot.lastSeen || 0);
              if (ls !== this.lastSeenHP[tid]) {
                this.lastSeenHP[tid] = ls;
                this.terakhirTerlihatGuru[tid] = sekarang;
              } else if (this.terakhirTerlihatGuru[tid] === 0) {
                this.terakhirTerlihatGuru[tid] = sekarang;
              }
              STATE.hp.hpTim[tid] = (sekarang - this.terakhirTerlihatGuru[tid]) < 40000;
            } else {
              this.terakhirTerlihatGuru[tid] = 0;
              STATE.hp.hpTim[tid] = false;
            }
          });

          const uc = data.ujiCoba || {};
          const ucHasilLama = { ...STATE.hp.ujiCoba.hasil };
          const ucHasilBaru = {
            1: Boolean(uc.hasil && uc.hasil['1']),
            2: Boolean(uc.hasil && uc.hasil['2']),
            3: Boolean(uc.hasil && uc.hasil['3']),
            4: Boolean(uc.hasil && uc.hasil['4'])
          };
          let adaBaruBerhasil = false;
          [1, 2, 3, 4].forEach((tid) => {
            if (!ucHasilLama[tid] && ucHasilBaru[tid]) adaBaruBerhasil = true;
          });
          STATE.hp.ujiCoba = {
            aktif: Boolean(uc.aktif),
            hasil: ucHasilBaru
          };
          if (adaBaruBerhasil && STATE.hp.ujiCoba.aktif) {
            SUARA.benar(1);
          }

          STATE.hp.statusServer = data.status || 'tutup';
          STATE.hp.modeTes = Boolean(data.modeTes);

          const pemenangId = data.pemenang ?? null;
          if (pemenangId === 1 || pemenangId === 2 || pemenangId === 3 || pemenangId === 4) {
            const timIdx = pemenangId - 1;
            const timObj = STATE.tim[timIdx];
            if (timObj) {
              if (data.modeTes) {
                if (!STATE.hp.bannerTercepat || STATE.hp.bannerTercepat.timIdx !== timIdx) {
                  STATE.hp.bannerTercepat = {
                    timIdx,
                    nama: timObj.nama,
                    warna: timObj.warna,
                    teksDiIsi: timObj.teksDiIsi || '#FFFFFF',
                    modeTes: true
                  };
                  SUARA.bukaRebutan();
                }
              } else if (STATE.hp.modeHP && STATE.rondeAktif === 2 && !STATE.terkunci && STATE.rebutanTimDipilih === null) {
                if (!STATE.timTerkunciR2.includes(timIdx)) {
                  STATE.hp.bannerTercepat = {
                    timIdx,
                    nama: timObj.nama,
                    warna: timObj.warna,
                    teksDiIsi: timObj.teksDiIsi || '#FFFFFF',
                    modeTes: false
                  };
                  menetapkanPemenangRebutan(timIdx, true);
                  return;
                }
              }
            }
          }

          if (
            STATE.rondeAktif === 2
            && STATE.layar === 'soal'
            && !STATE.terkunci
            && STATE.rebutanTimDipilih !== null
            && !data.modeTes
            && typeof data.pilihanHp === 'number'
            && data.pilihanHp >= 0
            && data.pilihanHp <= 3
            && !STATE.opsiSalahR2.includes(data.pilihanHp)
            && STATE.pilihanSementara !== data.pilihanHp
          ) {
            STATE.pilihanSementara = data.pilihanHp;
            SUARA.klik();
            render();
            return;
          }

          if (STATE.rondeAktif === 2 || STATE.layar === 'persiapanRonde2' || STATE.guruPanelBuka || STATE.hp.modalQRBuka) {
            render();
          }
        }, (error) => {
          STATE.hp.terhubungServer = false;
          render();
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.GET, pathBaru);
          }
        });

        if (renderUlang) render();
      },

      async aturUjiCoba(aktif, resetHasil = false) {
        if (!this.db || !this.sdk || !STATE.hp.kodeRuang || !STATE.hp.terhubungServer) return;
        const { doc, updateDoc } = this.sdk;
        const path = `ruang/${STATE.hp.kodeRuang}`;
        const h = resetHasil
          ? { '1': false, '2': false, '3': false, '4': false }
          : {
              '1': Boolean(STATE.hp.ujiCoba?.hasil?.[1]),
              '2': Boolean(STATE.hp.ujiCoba?.hasil?.[2]),
              '3': Boolean(STATE.hp.ujiCoba?.hasil?.[3]),
              '4': Boolean(STATE.hp.ujiCoba?.hasil?.[4])
            };
        try {
          await updateDoc(doc(this.db, 'ruang', STATE.hp.kodeRuang), {
            ujiCoba: {
              aktif: Boolean(aktif),
              hasil: h
            }
          });
        } catch (error) {
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.UPDATE, path);
          }
        }
      },

      async sinkronTim() {
        if (!this.db || !this.sdk || !STATE.hp.kodeRuang || !STATE.hp.terhubungServer) return;
        const { doc, updateDoc } = this.sdk;
        const path = `ruang/${STATE.hp.kodeRuang}`;
        try {
          await updateDoc(doc(this.db, 'ruang', STATE.hp.kodeRuang), {
            namaTim: this.namaTimAman(),
            warnaTim: this.warnaTimAman()
          });
        } catch (error) {
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.UPDATE, path);
          }
        }
      },

      async bukaRebutan(timTerkunci = [], modeTes = false, opsiSalah = [], soal = null) {
        if (!this.db || !this.sdk || !STATE.hp.kodeRuang || !STATE.hp.terhubungServer) return;
        const { doc, updateDoc } = this.sdk;
        const path = `ruang/${STATE.hp.kodeRuang}`;
        const soalAktif = soal || (STATE.rondeAktif === 2 ? ambilSoalAktif() : null);
        try {
          await updateDoc(doc(this.db, 'ruang', STATE.hp.kodeRuang), {
            status: 'buka',
            modeTes: Boolean(modeTes),
            ronde: modeTes ? 0 : Math.min(30, Math.max(0, Number(STATE.indeksSoal) + 1)),
            pemenang: null,
            waktuMenang: null,
            pilihanHp: null,
            terkunciTim: this.objekTerkunci(timTerkunci),
            opsiSalah: this.objekOpsiSalah(modeTes ? [] : opsiSalah),
            opsiTeks: this.objekOpsiTeks(modeTes ? null : soalAktif)
          });
        } catch (error) {
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.UPDATE, path);
          }
        }
      },

      async tutupRebutan(timTerkunci = [], opsiSalah = [], soal = null) {
        if (!this.db || !this.sdk || !STATE.hp.kodeRuang || !STATE.hp.terhubungServer) return;
        const { doc, updateDoc } = this.sdk;
        const path = `ruang/${STATE.hp.kodeRuang}`;
        const soalAktif = soal || (STATE.rondeAktif === 2 ? ambilSoalAktif() : null);
        const adaSoalR2 = STATE.rondeAktif === 2 && Boolean(soalAktif);
        try {
          await updateDoc(doc(this.db, 'ruang', STATE.hp.kodeRuang), {
            status: 'tutup',
            modeTes: false,
            ronde: adaSoalR2 ? Math.min(30, Math.max(0, Number(STATE.indeksSoal) + 1)) : 0,
            pemenang: null,
            waktuMenang: null,
            pilihanHp: null,
            terkunciTim: this.objekTerkunci(timTerkunci),
            opsiSalah: this.objekOpsiSalah(adaSoalR2 ? opsiSalah : []),
            opsiTeks: this.objekOpsiTeks(adaSoalR2 ? soalAktif : null)
          });
        } catch (error) {
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.UPDATE, path);
          }
        }
      },

      async sinkronPilihanR2(opsiIdx) {
        if (!this.db || !this.sdk || !STATE.hp.kodeRuang || !STATE.hp.terhubungServer) return;
        if (STATE.opsiSalahR2.includes(opsiIdx)) return;
        const { doc, updateDoc } = this.sdk;
        const path = `ruang/${STATE.hp.kodeRuang}`;
        try {
          await updateDoc(doc(this.db, 'ruang', STATE.hp.kodeRuang), {
            pilihanHp: typeof opsiIdx === 'number' ? opsiIdx : null
          });
        } catch (error) {
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.UPDATE, path);
          }
        }
      },

      async kunciPemenangManual(timIdx) {
        if (!this.db || !this.sdk || !STATE.hp.kodeRuang || !STATE.hp.terhubungServer) return;
        const { doc, updateDoc, serverTimestamp } = this.sdk;
        const path = `ruang/${STATE.hp.kodeRuang}`;
        try {
          await updateDoc(doc(this.db, 'ruang', STATE.hp.kodeRuang), {
            status: 'terkunci',
            pemenang: timIdx + 1,
            waktuMenang: serverTimestamp(),
            pilihanHp: null
          });
        } catch (error) {
          if (error instanceof Error && error.message.includes('Missing or insufficient permissions')) {
            handleFirestoreError(error, OperationType.UPDATE, path);
          }
        }
      }
    };

    /* Inisialisasi awal saat file HTML dibuka */
    resetStateTurnamen(false);
    FIREBASE_HP.inisialisasi();
    render();
  </script>
</body>
</html>
